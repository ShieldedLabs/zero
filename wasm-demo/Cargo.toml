# [zero] @claude A browser demo for the wasm build of librustzcash. Not published.
#
# This is a standalone crate rather than a member of the librustzcash workspace: it is an
# application, and keeping it out of the subtree keeps the subtree diff to library changes.
[package]
name = "zero-wasm-demo"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
hex = "0.4"
js-sys = "0.3"
rand_chacha = "0.3"
rusqlite = { version = "0.39", features = ["time", "array", "uuid", "hooks"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
# `default-features = false` throughout: the default feature sets enable `multicore`,
# and `halo2_proofs` refuses to compile for wasm32 without atomics.
zcash_client_backend = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_client_backend", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_client_sqlite = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_client_sqlite", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_keys = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_keys", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_primitives = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_primitives", default-features = false }
zcash_protocol = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/components/zcash_protocol" }
zip32 = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
