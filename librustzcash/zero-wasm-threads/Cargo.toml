# [zero] @claude The threaded wasm build; see WASM.md. Not published, empty on every
# target except wasm32-unknown-unknown, and outside the librustzcash workspace because it
# needs its own nightly toolchain.
[package]
name = "zero-wasm-threads"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
bench = false
doctest = false

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
# `no-bundler`: workers import the main module by URL rather than by a bundler's
# directory layout, which is what both `--target web` pages and the test runner serve.
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
# `multicore` is what this crate exists for: halo2 refuses it on wasm without atomics.
orchard = { version = "0.16", default-features = false, features = ["circuit", "multicore"] }
rand_chacha = "0.10"
rayon = "1"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
secrecy = "0.8"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3.54"
zcash_client_backend = { path = "../zcash_client_backend", default-features = false, features = ["orchard"] }
zcash_client_sqlite = { path = "../zcash_client_sqlite", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_note_encryption = "0.5"
zcash_primitives = { path = "../zcash_primitives", default-features = false }
zcash_protocol = { path = "../components/zcash_protocol" }
zero-wasm-smoke = { path = "../zero-wasm-smoke" }
