# [zero] @claude A wasm integration harness; see README.md. Not published, and empty on
# every target except wasm32-unknown-unknown.
[package]
name = "zero-wasm-smoke"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
bench = false
doctest = false

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
rand_chacha = "0.3"
rusqlite = { workspace = true, features = ["time", "array", "uuid", "hooks"] }
secrecy = "0.8"
sqlite-wasm-rs = "0.5"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
# `default-features = false` matters: the default feature set of these crates turns on
# `multicore`, and `halo2_proofs` hard-errors on wasm32 without atomics.
zcash_client_backend = { workspace = true, features = ["orchard", "transparent-inputs"] }
zcash_client_sqlite = { path = "../zcash_client_sqlite", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_protocol.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
secrecy = "0.8"
wasm-bindgen-test = "0.3.54"
