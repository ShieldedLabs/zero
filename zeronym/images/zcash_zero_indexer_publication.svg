    <filter id="panel-shadow"
            x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="6"
                    flood-color="#172033"
                    flood-opacity="0.06"/>
    </filter>

