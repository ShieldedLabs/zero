<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1960"
     height="1000"
     viewBox="0 0 1960 1000"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Zero-indexer transaction publication</title>
  <desc id="svg-desc">Wallet TLS connections terminate at zero-indexer shims inside locked enclaves. Shims connect to a shared zero-indexer hub inside another enclave. The hub has a dedicated indexer outside its enclave but inside its organizational boundary. All indexers and the hub publish to the mempool. The auditor is independent.</desc>

  <defs>
    <style>

.canvas {
    fill: #f8fafc;
}

.title {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 30px;
    font-weight: 720;
    letter-spacing: -0.4px;
}

.node-label {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 680;
    text-anchor: middle;
    dominant-baseline: middle;
}

.zero-label {
    fill: #6f2d1e;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 740;
    text-anchor: middle;
    dominant-baseline: middle;
}

.organization-label {
    fill: #746e67;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.enclave-label {
    fill: #27644c;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 750;
    letter-spacing: 0.25px;
}

.node {
    stroke-width: 2.4;
    vector-effect: non-scaling-stroke;
    filter: url(#node-shadow);
}

/* Class 1: wallets */
.wallet {
    fill: #f1edff;
    stroke: #7658bd;
}

/* Class 2: indexers */
.indexer {
    fill: #e8f1fb;
    stroke: #3e6f9d;
}

/* Class 3: mempool */
.cloud {
    fill: #e2f6fa;
    stroke: #318297;
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
    filter: url(#node-shadow);
}

/* Class 4: organizational boundaries */
.organization {
    fill: #f5f2ed;
    fill-opacity: 0.7;
    stroke: #aaa39a;
    stroke-width: 1.8;
    stroke-dasharray: 9 7;
    vector-effect: non-scaling-stroke;
}

/* Class 5: locked enclaves */
.enclave {
    fill: #eaf8f1;
    fill-opacity: 0.94;
    stroke: #3b8968;
    stroke-width: 2.3;
    vector-effect: non-scaling-stroke;
    filter: url(#panel-shadow);
}

.enclave-lock {
    fill: none;
    stroke: #317859;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.enclave-lock-body {
    fill: #317859;
}

/* Class 6: the zero-indexer family */
.zero-indexer {
    fill: #fff0e8;
    stroke: #d65d3a;
    stroke-width: 2.8;
}

.zero-brand-disc {
    fill: #d65d3a;
}

.zero-brand-ring {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    vector-effect: non-scaling-stroke;
}

.zero-brand-core {
    fill: #ffffff;
}

.auditor-eye {
    fill: #ffffff;
    stroke: #a7462e;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

.auditor-pupil {
    fill: #3b2f2b;
}

.eye-highlight {
    fill: #ffffff;
}

/* Connections */
.edge {
    fill: none;
    stroke: #496987;
    stroke-width: 2.35;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-local {
    fill: none;
    stroke: #7c8796;
    stroke-width: 2.1;
    stroke-dasharray: 5 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-publication {
    fill: none;
    stroke: #d65d3a;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-tls {
    fill: none;
    stroke: #7658bd;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.tls-badge {
    fill: #ffffff;
    stroke: #7658bd;
    stroke-width: 1.4;
    vector-effect: non-scaling-stroke;
}

.tls-text {
    fill: #6245a6;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
}

.continuation-dot {
    fill: #8a95a6;
}

    </style>

    <filter id="node-shadow"
