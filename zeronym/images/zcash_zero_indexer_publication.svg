            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#218c69"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1780" height="900"/>


  <defs>
    <filter id="node-shadow"
            x="-20%" y="-25%" width="140%" height="160%">
