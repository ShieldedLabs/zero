                    stdDeviation="5"
                    flood-color="#172033"
                    flood-opacity="0.10"/>
    </filter>

    <filter id="panel-shadow"
            x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="6"
                    flood-color="#172033"
                    flood-opacity="0.06"/>
    </filter>

    <style>
      .node,
      .cloud {
          filter: url(#node-shadow);
      }

      .tee {
          filter: url(#panel-shadow);
      }

      .continuation-dot {
          fill: #8793a8;
      }
    </style>
  </defs>

