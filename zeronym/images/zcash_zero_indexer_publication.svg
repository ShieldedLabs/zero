<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1780"
     height="900"
     viewBox="0 0 1780 900"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Zero-indexer transaction publication</title>
  <desc id="svg-desc">Wallet TLS connections terminate at zero-indexer shims inside trusted execution environments. Shims connect to a shared hub inside another trusted execution environment. Indexers retain their direct connections to the mempool.</desc>

  <defs>
    <style>

.canvas {
    fill: #fbfcfe;
}


.mixnet {
    fill: #ede8fb;
    stroke: #7456c7;
}

.title {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 30px;
    font-weight: 700;
}

.node-label {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 650;
    text-anchor: middle;
    dominant-baseline: middle;
}

.small-label {
    fill: #516078;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 600;
}

.boundary-label {
    fill: #667085;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 650;
}

.node {
    stroke-width: 2.2;
    vector-effect: non-scaling-stroke;
}

.wallet {
    fill: #f3efff;
    stroke: #7456c7;
}

.indexer {
    fill: #eaf2ff;
    stroke: #4775bd;
}

.shim {
    fill: #fff1d7;
    stroke: #d88121;
}

.hub {
    fill: #dcf7ec;
    stroke: #218c69;
}

.cloud {
    fill: #eaf4fa;
    stroke: #4c7892;
    stroke-width: 2.4;
    vector-effect: non-scaling-stroke;
}

.edge {
    fill: none;
    stroke: #68758a;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-local {
    fill: none;
    stroke: #8a94a6;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-publication {
    fill: none;
    stroke: #218c69;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.organization {
    fill: #f7f9fc;
    fill-opacity: 0.72;
    stroke: #a9b2c2;
    stroke-width: 1.8;
    stroke-dasharray: 8 6;
    vector-effect: non-scaling-stroke;
}

.tee {
    fill: #ebfaf4;
    fill-opacity: 0.9;
    stroke: #218c69;
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

.tls-badge {
    fill: #ffffff;
    stroke: #7456c7;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

.tls-text {
    fill: #5e43aa;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 750;
    text-anchor: middle;
    dominant-baseline: middle;
}

.lock {
    fill: none;
    stroke: #218c69;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.auditor-label {
    fill: #5f4b13;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-anchor: middle;
}

.eye {
    fill: #ffffff;
    stroke: #b38a25;
    stroke-width: 2.2;
    vector-effect: non-scaling-stroke;
}

.pupil {
    fill: #29303d;
}

.highlight {
    fill: #ffffff;
}

    </style>

    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
