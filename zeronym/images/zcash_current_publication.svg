<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1960"
     height="1000"
     viewBox="0 0 1960 1000"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Current Zcash transaction publication</title>
  <desc id="svg-desc">Wallets connect over TLS directly to indexers. The indexers publish transactions to the mempool.</desc>

  <defs>
    <style>

.canvas {
    fill: #f8fafc;
}

.title {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 30px;
    font-weight: 720;
    letter-spacing: -0.4px;
}

.node-label {
    fill: #172033;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 680;
    text-anchor: middle;
    dominant-baseline: middle;
}

.zero-label {
    fill: #6f2d1e;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 740;
    text-anchor: middle;
    dominant-baseline: middle;
}

.organization-label {
    fill: #746e67;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.enclave-label {
    fill: #27644c;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 750;
    letter-spacing: 0.25px;
}

.node {
    stroke-width: 2.4;
    vector-effect: non-scaling-stroke;
    filter: url(#node-shadow);
}

/* Class 1: wallets */
.wallet {
    fill: #f1edff;
    stroke: #7658bd;
}

/* Class 2: indexers */
.indexer {
    fill: #e8f1fb;
    stroke: #3e6f9d;
}

/* Class 3: mempool */
.cloud {
    fill: #e2f6fa;
    stroke: #318297;
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
    filter: url(#node-shadow);
}

/* Class 4: organizational boundaries */
.organization {
    fill: #f5f2ed;
    fill-opacity: 0.7;
    stroke: #aaa39a;
    stroke-width: 1.8;
    stroke-dasharray: 9 7;
    vector-effect: non-scaling-stroke;
}

/* Class 5: locked enclaves */
.enclave {
    fill: #eaf8f1;
    fill-opacity: 0.94;
    stroke: #3b8968;
    stroke-width: 2.3;
    vector-effect: non-scaling-stroke;
    filter: url(#panel-shadow);
}

.enclave-lock {
    fill: none;
    stroke: #317859;
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.enclave-lock-body {
    fill: #317859;
}

/* Class 6: the zero-indexer family */
.zero-indexer {
    fill: #fff0e8;
    stroke: #d65d3a;
    stroke-width: 2.8;
}

.zero-brand-disc {
    fill: #d65d3a;
}

.zero-brand-ring {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    vector-effect: non-scaling-stroke;
}

.zero-brand-core {
    fill: #ffffff;
}

.auditor-eye {
    fill: #ffffff;
    stroke: #a7462e;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

.auditor-pupil {
    fill: #3b2f2b;
}

.eye-highlight {
    fill: #ffffff;
}

/* Connections */
.edge {
    fill: none;
    stroke: #496987;
    stroke-width: 2.35;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-local {
    fill: none;
    stroke: #7c8796;
    stroke-width: 2.1;
    stroke-dasharray: 5 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-publication {
    fill: none;
    stroke: #d65d3a;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.edge-tls {
    fill: none;
    stroke: #7658bd;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
}

.tls-badge {
    fill: #ffffff;
    stroke: #7658bd;
    stroke-width: 1.4;
    vector-effect: non-scaling-stroke;
}

.tls-text {
    fill: #6245a6;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
}

.continuation-dot {
    fill: #8a95a6;
}

    </style>

    <filter id="node-shadow"
            x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="4"
                    flood-color="#172033"
                    flood-opacity="0.11"/>
    </filter>

    <filter id="panel-shadow"
            x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0"
                    dy="3"
                    stdDeviation="6"
                    flood-color="#172033"
                    flood-opacity="0.06"/>
    </filter>

    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496987"/>
    </marker>

    <marker id="arrow-local"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8796"/>
    </marker>

    <marker id="arrow-publication"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d65d3a"/>
    </marker>

    <marker id="arrow-tls"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7658bd"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1960" height="1000"/>

  <text x="980.0" y="52" class="title" text-anchor="middle">Current Zcash transaction publication</text>
  <path class="edge-tls" d="M 245,185 C 405,185 635,143 827,143" marker-end="url(#arrow-tls)"/>
  <g transform="translate(500 164.8)">
    <rect class="tls-badge" x="-34" y="-13" width="68" height="26" rx="13"/>
    <path d="M -21,-2 V -6
             C -21,-12 -11,-12 -11,-6
             V -2"
          fill="none"
          stroke="#7456c7"
          stroke-width="1.5"
          stroke-linecap="round"/>
    <rect x="-22.5" y="-3"
          width="13" height="10"
          rx="2"
          fill="#7456c7"/>
    <text class="tls-text" x="11" y="1">TLS</text>
  </g>
  <path class="edge-tls" d="M 245,275 C 405,275 635,167 827,167" marker-end="url(#arrow-tls)"/>
  <g transform="translate(500 223.2)">
    <rect class="tls-badge" x="-34" y="-13" width="68" height="26" rx="13"/>
    <path d="M -21,-2 V -6
             C -21,-12 -11,-12 -11,-6
             V -2"
          fill="none"
          stroke="#7456c7"
          stroke-width="1.5"
          stroke-linecap="round"/>
    <rect x="-22.5" y="-3"
          width="13" height="10"
          rx="2"
          fill="#7456c7"/>
    <text class="tls-text" x="11" y="1">TLS</text>
  </g>
  <path class="edge-tls" d="M 245,505 C 405,505 635,613 827,613" marker-end="url(#arrow-tls)"/>
  <g transform="translate(500 556.8)">
    <rect class="tls-badge" x="-34" y="-13" width="68" height="26" rx="13"/>
    <path d="M -21,-2 V -6
             C -21,-12 -11,-12 -11,-6
             V -2"
          fill="none"
          stroke="#7456c7"
          stroke-width="1.5"
          stroke-linecap="round"/>
    <rect x="-22.5" y="-3"
          width="13" height="10"
          rx="2"
          fill="#7456c7"/>
    <text class="tls-text" x="11" y="1">TLS</text>
  </g>
  <path class="edge-tls" d="M 245,595 C 405,595 635,637 827,637" marker-end="url(#arrow-tls)"/>
  <g transform="translate(500 615.2)">
    <rect class="tls-badge" x="-34" y="-13" width="68" height="26" rx="13"/>
    <path d="M -21,-2 V -6
             C -21,-12 -11,-12 -11,-6
             V -2"
          fill="none"
          stroke="#7456c7"
          stroke-width="1.5"
          stroke-linecap="round"/>
    <rect x="-22.5" y="-3"
          width="13" height="10"
          rx="2"
          fill="#7456c7"/>
    <text class="tls-text" x="11" y="1">TLS</text>
  </g>
  <path class="edge" d="M 1035,155 C 1280,155 1515,285 1750,398" marker-end="url(#arrow)"/>
  <path class="edge" d="M 1035,625 C 1290,625 1530,585 1765,518" marker-end="url(#arrow)"/>
  <g>
    <ellipse class="node wallet"
             cx="150" cy="185" rx="95" ry="36"/>
    <text class="node-label" x="150" y="185">wallet</text>
  </g>
  <g>
    <ellipse class="node wallet"
             cx="150" cy="275" rx="95" ry="36"/>
    <text class="node-label" x="150" y="275">wallet</text>
  </g>
  <g>
    <ellipse class="node indexer"
             cx="930" cy="155" rx="105" ry="42"/>
    <text class="node-label" x="930" y="155">indexer</text>
  </g>
  <g>
    <ellipse class="node wallet"
             cx="150" cy="505" rx="95" ry="36"/>
    <text class="node-label" x="150" y="505">wallet</text>
  </g>
  <g>
    <ellipse class="node wallet"
             cx="150" cy="595" rx="95" ry="36"/>
    <text class="node-label" x="150" y="595">wallet</text>
  </g>
  <g>
    <ellipse class="node indexer"
             cx="930" cy="625" rx="105" ry="42"/>
    <text class="node-label" x="930" y="625">indexer</text>
  </g>
  <g>
    <path class="cloud" d="M 1765.0,510.4 C 1725.4,510.4 1714.4,479.6 1734.2,448.8 C 1718.8,411.4 1749.6,380.6 1782.6,393.8 C 1795.8,347.6 1850.8,345.4 1868.4,391.6 C 1908.0,382.8 1925.6,418.0 1910.2,451.0 C 1934.4,481.8 1905.8,512.6 1875.0,508.2 L 1765.0,510.4 Z"/>
    <text class="node-label"
          x="1824.4" y="453.2">mempool</text>
  </g>
  <g aria-label="more">
    <circle class="continuation-dot"
            cx="150" cy="735" r="4.5"/>
    <circle class="continuation-dot"
            cx="150" cy="757" r="4.5"/>
    <circle class="continuation-dot"
            cx="150" cy="779" r="4.5"/>
  </g>
  <g aria-label="more">
    <circle class="continuation-dot"
            cx="930" cy="735" r="4.5"/>
    <circle class="continuation-dot"
            cx="930" cy="757" r="4.5"/>
    <circle class="continuation-dot"
            cx="930" cy="779" r="4.5"/>
  </g>
</svg>
