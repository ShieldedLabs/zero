[package]
name = "zero-indexer-hub"
version = "0.1.0"
edition = "2021"
publish = false
description = "Zeronym zero-indexer-hub: batches migration transactions from many shims and publishes them together"

# Standalone workspace, for the same reason as the shim: there is no Cargo.toml
# at the repo root, and this stanza stops the crate being absorbed into the
# vendored zebra/ or zaino/ workspaces if one ever appears above it. It also
# keeps this crate's lockfile authoritative, which is what makes the
# reproducible build pin what it claims to pin.
[workspace]

[lib]
name = "zero_indexer_hub"
path = "src/lib.rs"

[[bin]]
name = "zero-indexer-hub"
path = "src/main.rs"

[features]
# Compile the Nym mixnet driver (src/nym_driver.rs) and link nym-sdk. Off by
# default: the shipped clearnet binary does not carry the SDK, so its
# reproducible measurement is unchanged. The enclave build turns this on.
mixnet-driver = ["dep:nym-sdk"]
# The driver's localnet path: connect to the mixnet the nymnet harness starts
# from a hardcoded topology file, for the end-to-end test. Test-only; the
# production driver never loads a topology, so nym-topology stays out of the
# enclave build.
mixnet-localnet = ["mixnet-driver", "dep:nym-topology"]

[dependencies]
# The real Zcash parser, vendored, same as the shim. The hub re-parses every
# migration it receives rather than trusting the shim, so it needs exactly the
# parser the shim used.
zebra-chain = { path = "../../zebra/zebra-chain" }

# CompactTxStreamer types for the indexer hop (SendTransaction, GetLightdInfo).
# default-features = false is REQUIRED, not tidiness: the default "heavy" feature
# pulls a SECOND zebra-chain from crates.io alongside our vendored path dep, and
# its build.rs regenerates the committed protos whenever protoc is reachable.
zaino-proto = { path = "../../zaino/packages/zaino-proto", default-features = false }
prost = "0.14"

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

# Chain connection out (JSON-RPC to zebrad/zcashd) and the inbound serving path
# in. hyper rather than a JSON-RPC or web framework because the surface is tiny
# (two RPC methods out, one POST in) and the shim already proves this stack
# builds under StageX musl.
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A flush publishes the whole (transaction x node) product at once. Sequential
# calls with a 10 s per-call ceiling would exceed a block interval on one hung
# node, which would reintroduce the ordering the shuffle removes.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The queue's dedup key is sha256(tx_bytes), NOT the txid: under ZIP 244 a v5/v6
# txid excludes authorizing data, so it is the wrong identity for a byte-level
# dedup, and a submitter-chosen key would let an attacker suppress someone
# else's entry by colliding with it.
sha2 = "0.10"

# The hub holds decrypted transaction bytes in plaintext; wipe them on drop so a
# copy does not linger in freed enclave memory (REVIEW.md).
zeroize = "1"

# TLS to the indexer. Without it the enclave's parent host reads every batch in
# the clear moments before it is public. Roots are compiled in because an enclave
# has no system trust store, and one the operator could edit would let them
# substitute their own CA.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

# Ordering within a flush must be unpredictable, so this is a security
# dependency rather than a convenience one. See flush ordering in src/.
rand = "0.9"

# The Nym mixnet client, behind the `mixnet-driver` feature (optional = true, so
# the default clearnet build never compiles it). The git tag MUST match the nym
# release the gateway and mixnodes run, and the shim's pin. The crypto-common
# conflict this drags in is resolved by the [patch] at the bottom of this file.
nym-sdk = { git = "https://github.com/nymtech/nym", tag = "nym-binaries-v2026.15-bydgoszcz", optional = true }

# Only for the localnet end-to-end test (the mixnet-localnet feature): loads the
# hardcoded topology the nymnet harness writes so the driver connects to the
# local mixnet instead of the default network. Never in the production driver.
nym-topology = { git = "https://github.com/nymtech/nym", tag = "nym-binaries-v2026.15-bydgoszcz", features = ["persistence"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

# Substitute the vendored slim copy of nym-upgrade-mode-check (see
# vendor/nym-upgrade-mode-check/Cargo.toml). The real crate's jwt-simple subtree
# cannot share a lockfile with the vendored zebra-chain: superboring's ml-dsa
# wants stable crypto-common ^0.2, while zcash_primitives pins the pre-release
# =0.2.0-rc.1. The slim copy keeps the attestation data types verbatim and drops
# the JWT half the driver never touches. Unconditional (Cargo has no per-feature
# patch), but only binds when nym-sdk is in the graph, i.e. with mixnet-driver.
[patch."https://github.com/nymtech/nym"]
nym-upgrade-mode-check = { path = "../vendor/nym-upgrade-mode-check" }
