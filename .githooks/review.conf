# Configuration for the pre-push adversarial review (.githooks/pre-push).

# Which reviewer to run: claude | codex | custom
REVIEW_BACKEND="${REVIEW_BACKEND:-claude}"

# Model override. Empty means Claude Code's default for the session.
#   fable | opus | sonnet | haiku, or a full model id like claude-opus-5.
# `opus-5` is NOT a valid alias; Claude Code rejects it and the review fails.
REVIEW_MODEL="${REVIEW_MODEL:-opus}"

# Effort override. Empty uses Claude Code's default for the model.
# Provider-specific values: low | medium | high | xhigh | max.
# claude backend only; codex takes its own reasoning settings.
REVIEW_EFFORT="${REVIEW_EFFORT:-high}"

# Seconds to wait at the "Would you like a local review?" prompt before
# assuming no. The push is never held past this.
REVIEW_PROMPT_TIMEOUT="${REVIEW_PROMPT_TIMEOUT:-10}"

# Hard cap on the reviewer, in seconds. On expiry REVIEW.md says the review
# FAILED rather than pretending the range came back clean.
REVIEW_TIMEOUT="${REVIEW_TIMEOUT:-900}"

# Diffs longer than this are truncated before review. The truncation is always
# stated in REVIEW.md; it is never applied silently.
REVIEW_MAX_DIFF_LINES="${REVIEW_MAX_DIFF_LINES:-6000}"

# Space-separated pathspecs excluded from the diff. Empty by default and
# probably should stay that way: the vendored trees hold our [zero] deltas, so
# excluding `zebra/` would drop exactly the code most worth reviewing. Reach
# for this only on a known-noisy push, e.g.:
#     REVIEW_EXCLUDE_PATHS="zcashd/depends zebra/book" git push
REVIEW_EXCLUDE_PATHS="${REVIEW_EXCLUDE_PATHS:-}"

# A clickable file:// line is always printed back to the pushing terminal, if
# it is still open. This only controls the desktop notification alongside it.
#   0     no notification
#   1     notify                                       (default)
#   open  notify AND open REVIEW.md automatically
#
# A notification cannot open the file on click unless terminal-notifier is
# installed (`brew install terminal-notifier`); macOS gives `display
# notification` no click action of its own. The file:// line is the reliable
# route either way.
REVIEW_NOTIFY="${REVIEW_NOTIFY:-1}"

# Only used by REVIEW_NOTIFY=open (and terminal-notifier's click action).
# Empty auto-detects: `open` on macOS, `xdg-open` on Linux/WSL.
#     REVIEW_OPEN_CMD="code"
REVIEW_OPEN_CMD="${REVIEW_OPEN_CMD:-}"

# Only for REVIEW_BACKEND=custom. Reads the prompt on stdin, writes markdown
# on stdout. Keep it read-only.
#     REVIEW_CMD="my-reviewer --stdin --markdown"
REVIEW_CMD="${REVIEW_CMD:-}"
