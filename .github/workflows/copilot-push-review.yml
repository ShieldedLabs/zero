name: Copilot Review

# Copilot code review only ever looks at pull requests. There is no trigger, API
# or setting that reviews a bare commit range, so a commit pushed straight to
# main is invisible to it -- and this repository does not require pull requests.
#
# This workflow manufactures the one thing Copilot will look at. On a push to
# main it points a scratch base branch at the commit main was on BEFORE the push,
# snapshots the new tip on a second branch, and opens a pull request between
# them. The diff of that pull request is exactly the commits that were just
# pushed, so Copilot reviews them. The review is copied into this run's job
# summary, then the pull request is closed and the snapshot deleted.
#
# The base is derived from `github.event.before` every run rather than being
# advanced and remembered, so there is no lagging state to get out of step with
# main. A force-push makes before/after non-linear, which the two-dot diff still
# renders correctly.
#
# Pushes that ARRIVED through a pull request are skipped: Copilot already
# reviewed them on the way in, and reviewing the merge again is pure noise.
#
# The pull requests this opens are scratch. They are closed automatically, never
# merged, and the branches under copilot-review/ are deleted on the way out.
#
# REVIEW MODES. Copilot reads its custom instructions from
# .github/copilot-instructions.md on the head branch of the pull request, and
# from nowhere else -- there is no per-run way to hand it a different prompt.
# The modes therefore live as fragments in .github/review-modes/, and this
# workflow composes the requested one into that path on BOTH scratch branch
# tips. Writing the same content to both keeps it out of the two-dot diff, so
# the review still sees exactly the pushed range and nothing else. Pushes use
# `code`; `security` and `full` are for manual runs.
#
# One consequence worth knowing: a pushed range that itself edits
# .github/copilot-instructions.md or .github/review-modes/** has that edit
# masked by the overlay, so changes to the review prompt are not themselves
# reviewed. That is a fair trade for being able to select a mode at all.
#
# IDENTITY MATTERS. A pull request opened with the built-in GITHUB_TOKEN is
# authored by github-actions[bot], and Copilot does not review it: measured
# directly, the identical diff into the identical base got no review as the bot
# (PR #39) and a review in under two minutes as a real user (PR #41). So the
# pull request is created with COPILOT_REVIEW_PAT, a personal access token
# belonging to someone holding a Copilot seat. It needs BOTH `repo` and
# `workflow` scopes: the snapshot branch mirrors whatever landed on main, and a
# token without `workflow` is refused the moment a pushed range touches
# .github/workflows/**. Without that secret the workflow
# still runs and still cleans up, but the review will not arrive, and the job
# summary says so rather than implying the range came back clean.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Review style
        type: choice
        required: false
        default: code
        options:
          - code
          - security
          - full
      ref:
        description: Commit to review (defaults to the last commit on the branch)
        type: string
        required: false

# Serialize. Two pushes in quick succession would otherwise race on the shared
# base branch and produce two pull requests with overlapping diffs.
concurrency:
  group: copilot-push-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: copilot-review-base
  # Applied to every scratch pull request so they can be filtered out of, or
  # into, a search: `is:pr label:automated-review`.
  REVIEW_LABEL: automated-review

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # Pinned by SHA, not tag: this job holds contents:write and
        # pull-requests:write, and a tag can be moved under it.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The credential git pushes with, not just the one `gh` calls with.
          # checkout persists whatever it is given, so leaving this at the
          # default makes every `git push` below act as the GitHub App, and the
          # App is refused outright when the pushed range touches
          # .github/workflows/** -- which is exactly what this workflow's own
          # commits do. GITHUB_TOKEN can never be granted that permission, so
          # the PAT has to own the push as well as the pull request.
          token: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}

      - name: Pick the review mode
        id: mode
        env:
          # A push is unattended, so it gets the cheap, high-signal review.
          # Anything heavier is asked for deliberately.
          REQUESTED: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          mode="${REQUESTED:-code}"
          case "$mode" in
            code)     label="Code review";                     timeout=420 ;;
            security) label="Security review";                 timeout=600 ;;
            full)     label="Full review (code + security)";   timeout=600 ;;
            *)
              echo "unknown mode: $mode" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "timeout=$timeout" >>"$GITHUB_OUTPUT"
          echo "Review mode: $mode ($label)"

      # The checked-in instructions file is what a human-opened pull request
      # gets reviewed against, and it is generated from the same fragments. If
      # it has drifted, real pull requests are being reviewed against a stale
      # prompt. Say so, but do not fail this run over it -- the run composes its
      # own copy and is unaffected.
      - name: Check the checked-in instructions are in sync
        id: drift
        continue-on-error: true
        run: .github/review-modes/compose.sh --check code

      - name: Decide whether this push needs a review
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_INPUT: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          after="$AFTER"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual runs review one commit, so the workflow can be tested
            # without pushing anything, and so an older commit can be re-reviewed
            # under a different mode.
            if [ -n "$REF_INPUT" ]; then
              after=$(git rev-parse "${REF_INPUT}^{commit}")
            fi
            before=$(git rev-parse "${after}~1")
          else
            before="$BEFORE"
          fi

          # A push that created the branch, or whose previous tip has been
          # garbage collected, has nothing coherent to diff against.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base for this push; skipping"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "previous tip $before is not present; skipping"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$before" = "$after" ]; then
            echo "nothing new; skipping"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$before" "$after" | wc -l | tr -d ' ')
          if [ "$changed" -eq 0 ]; then
            echo "empty diff; skipping"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base=$before" >>"$GITHUB_OUTPUT"
          echo "head=$after" >>"$GITHUB_OUTPUT"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "run=true" >>"$GITHUB_OUTPUT"

      - name: Skip pushes that already came through a pull request
        if: steps.gate.outputs.run == 'true'
        id: prcheck
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A manual run is a deliberate request, usually to re-review something
          # under a heavier mode. Do not second-guess it.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Any pull request already associated with this commit means Copilot
          # saw it on the way in.
          count=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq 'length' 2>/dev/null || echo 0)
          if [ "$count" != "0" ]; then
            echo "commit arrived via a pull request; already reviewed"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Open the review pull request
        if: steps.gate.outputs.run == 'true' && steps.prcheck.outputs.run == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.gate.outputs.base }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          CHANGED: ${{ steps.gate.outputs.changed }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_LABEL: ${{ steps.mode.outputs.label }}
          GIT_AUTHOR_NAME: copilot-review
          GIT_AUTHOR_EMAIL: copilot-review@users.noreply.github.com
          GIT_COMMITTER_NAME: copilot-review
          GIT_COMMITTER_EMAIL: copilot-review@users.noreply.github.com
        run: |
          set -euo pipefail
          short_head=$(git rev-parse --short "$HEAD_SHA")
          short_base=$(git rev-parse --short "$BASE_SHA")
          head_branch="copilot-review/${MODE}-${short_head}"

          # The mode's prompt, composed from the fragments on the checked-out
          # tip -- never from whatever the reviewed range happens to contain.
          instructions="$RUNNER_TEMP/copilot-instructions.md"
          .github/review-modes/compose.sh "$MODE" >"$instructions"
          blob=$(git hash-object -w "$instructions")

          # Lay that one file over a commit without touching the working tree,
          # by building the new tree in a scratch index. Both scratch branch
          # tips get the identical blob, so it cancels out of the diff.
          overlay() {
            local base=$1 idx tree
            idx="$RUNNER_TEMP/index.$$"
            rm -f "$idx"
            GIT_INDEX_FILE="$idx" git read-tree "$base"
            GIT_INDEX_FILE="$idx" git update-index --add \
              --cacheinfo "100644,${blob},.github/copilot-instructions.md"
            tree=$(GIT_INDEX_FILE="$idx" git write-tree)
            rm -f "$idx"
            git commit-tree "$tree" -p "$base" -m "Review instructions: ${MODE}"
          }

          base_commit=$(overlay "$BASE_SHA")
          head_commit=$(overlay "$HEAD_SHA")

          # The scratch base: exactly where main stood before this push.
          git push --force origin "${base_commit}:refs/heads/${BASE_BRANCH}"
          git push --force origin "${head_commit}:refs/heads/${head_branch}"

          # Recorded BEFORE the pull request is created, so that a failure in
          # `gh pr create` still leaves the cleanup step something to delete.
          # Keyed off the pull request number instead, a creation failure would
          # strand this branch.
          echo "head_branch=$head_branch" >>"$GITHUB_OUTPUT"

          body=$(printf '%s\n' \
            "Automated review of commits pushed directly to \`main\`, which Copilot cannot see otherwise." \
            "" \
            "Range: \`${short_base}..${short_head}\` (${CHANGED} files)" \
            "Mode: \`${MODE}\` — ${MODE_LABEL}" \
            "" \
            "**This pull request is scratch and is closed automatically. Do not merge it.**")

          # Ensure the label exists before it is applied. This errors once the
          # label is present, which is the normal case, so the failure is
          # tolerated rather than treated as a problem.
          gh label create "$REVIEW_LABEL" \
            --repo "$REPO" \
            --color 0E8A16 \
            --description "Scratch PR opened by the Copilot Review workflow; auto-closed, never merged" \
            >/dev/null 2>&1 || true

          pr_url=$(gh pr create \
            --repo "$REPO" \
            --base "$BASE_BRANCH" \
            --head "$head_branch" \
            --title "Copilot ${MODE} review: main ${short_base}..${short_head}" \
            --label "$REVIEW_LABEL" \
            --body "$body")

          pr_number=$(basename "$pr_url")
          echo "number=$pr_number" >>"$GITHUB_OUTPUT"
          echo "url=$pr_url" >>"$GITHUB_OUTPUT"
          echo "range=${short_base}..${short_head}" >>"$GITHUB_OUTPUT"

      # Belt and braces. If the ruleset covers this base branch the review is
      # requested automatically and this is a no-op; if it does not, this asks
      # explicitly. Failure is tolerated so a permissions quirk cannot fail the
      # run before the wait step has had a chance.
      - name: Ask Copilot to review
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo '{"reviewers":["Copilot"]}' \
            | gh api "repos/$REPO/pulls/$PR/requested_reviewers" -X POST --input - >/dev/null || true

      - name: Wait for the review, then record it
        if: steps.pr.outputs.number != ''
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          RANGE: ${{ steps.pr.outputs.range }}
          PR_URL: ${{ steps.pr.outputs.url }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_LABEL: ${{ steps.mode.outputs.label }}
          REVIEW_TIMEOUT_SECONDS: ${{ steps.mode.outputs.timeout }}
          DRIFT: ${{ steps.drift.outcome }}
          HAVE_PAT: ${{ secrets.COPILOT_REVIEW_PAT != '' }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + REVIEW_TIMEOUT_SECONDS ))
          found=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                  --jq '[.[] | select(.user.login | test("copilot";"i"))] | length' 2>/dev/null || echo 0)
            if [ "$n" != "0" ]; then
              found=1
              break
            fi
            sleep 20
          done

          {
            printf '# %s of `main` %s\n\n' "$MODE_LABEL" "$RANGE"
            printf 'Mode: `%s`\n\n' "$MODE"
            if [ "$DRIFT" = "failure" ]; then
              printf '> **Note:** `.github/copilot-instructions.md` is out of sync with\n'
              printf '> `.github/review-modes/`. This run composed its own prompt and is\n'
              printf '> unaffected, but human-opened pull requests are being reviewed against\n'
              printf '> the stale file. Regenerate it with\n'
              printf '> `.github/review-modes/compose.sh code > .github/copilot-instructions.md`.\n\n'
            fi
            if [ "$found" = "0" ]; then
              printf '**No review arrived within %ss.**\n\n' "$REVIEW_TIMEOUT_SECONDS"
              printf 'This is a reviewer failure, not a clean review: nothing was checked.\n\n'
              if [ "$HAVE_PAT" != "true" ]; then
                printf 'The COPILOT_REVIEW_PAT secret is not set, so the pull request was opened\n'
                printf 'by github-actions[bot], which Copilot does not review. That is the most\n'
                printf 'likely cause here. See the note at the top of the workflow.\n'
              else
                printf 'Check whether Copilot code review is enabled for `%s`, whether the token\n' "$BASE_BRANCH"
                printf 'owner holds a Copilot seat, and whether GitHub reports a Copilot incident.\n'
              fi
            else
              printf '## Summary\n\n'
              gh api "repos/$REPO/pulls/$PR/reviews" \
                --jq '.[] | select(.user.login | test("copilot";"i")) | .body' \
                | sed 's/^/> /'
              printf '\n## Inline findings\n\n'
              count=$(gh api "repos/$REPO/pulls/$PR/comments" \
                        --jq '[.[] | select(.user.login | test("copilot";"i"))] | length')
              if [ "$count" = "0" ]; then
                printf '_No inline findings._\n'
              else
                gh api "repos/$REPO/pulls/$PR/comments" \
                  --jq '.[] | select(.user.login | test("copilot";"i"))
                        | "### `\(.path):\(.line // .original_line)`\n\n\(.body)\n"'
              fi
            fi
            printf '\nReviewed on %s (closed automatically).\n' "$PR_URL"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "found=$found" >>"$GITHUB_OUTPUT"

      # Always runs, so a timeout or a failure above still cleans up rather than
      # leaving scratch pull requests and branches behind.
      - name: Close the review pull request and delete the snapshot
        if: always() && steps.pr.outputs.head_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            gh pr close "$PR" --repo "$REPO" \
              --comment "Recorded in the workflow run summary. Closing; this pull request is never merged." || true
          fi
          git push origin --delete "$HEAD_BRANCH" || true
