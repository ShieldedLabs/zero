name: Copilot Review

# Copilot code review only ever looks at pull requests. There is no trigger, API
# or setting that reviews a bare commit range, and no per-run way to hand it a
# different prompt.
#
# This workflow manufactures the one thing Copilot will look at. It points a
# scratch base branch at the start of a commit range, snapshots the end of the
# range on a second branch, and opens a pull request between them. The diff of
# that pull request is exactly the range, so Copilot reviews it, under the
# prompt of whichever mode was asked for. Then the pull request is closed and
# both branches deleted.
#
# TRIGGERS. A pull request into main that touches a sensitive path, or carries
# the `security-review` label, gets a `security` review of its whole range,
# from its merge base with main to its head. The path list lives in the "Check
# the pull request needs a security review" step. Fork and draft pull requests
# are skipped, and a new push to the pull request supersedes the run reviewing
# the old head. A manual dispatch can run any mode against one commit. Code
# review of every pull request is not done here: the repository's Copilot code
# review ruleset already does it on the pull request itself.
#
# REVIEW_REPO. The scratch branches and pull request go to the repository named
# by the REVIEW_REPO variable, which defaults to this one. `security` and `full`
# only run when REVIEW_REPO is private, read from the API on every run, and
# anything short of a definite "private" counts as not private. Otherwise they
# skip, with the reason in the job summary, rather than publish anywhere.
# `code` may target any repository. Moving to a different target later is a
# change to the variable only.
#
# WHAT LEAVES THE RUN. When REVIEW_REPO is private, the job summary and the
# logs carry only the status and a link to the private pull request: never a
# review body, an inline comment, or a count of them. The review stays where it
# was written. When the target is public the scratch pull request is public
# too, and the summary copies the review into the run.
#
# BRANCH NAMING. Each run pushes copilot-review/base-<run>-<attempt> and
# copilot-review/head-<run>-<attempt>, and deletes both on the way out, so no
# two runs share a branch. The scratch pull requests are closed automatically
# and never merged. REVIEW_REPO's Copilot code review ruleset should include
# refs/heads/copilot-review/base-* so the review is requested automatically;
# the workflow also asks for it explicitly.
#
# MIRROR. A REVIEW_REPO other than this one must hold a seeded copy of main, so
# that each run only sends the objects that are new since; the workflow does
# not maintain it. GitHub Actions should be disabled there, since the pushed
# tree carries this repository's workflows -- provided Copilot code review
# still works with Actions off.
#
# REVIEW MODES. Copilot reads its custom instructions from
# .github/copilot-instructions.md on the head branch of the pull request, and
# from nowhere else. The modes therefore live as fragments in
# .github/review-modes/, and this workflow composes the requested one into that
# path on BOTH scratch branch tips. Writing the same content to both keeps it
# out of the diff (see the overlay notes in "Open the review pull request"), so
# the review still sees exactly the range and nothing else.
#
# One consequence worth knowing: a reviewed range that itself edits
# .github/copilot-instructions.md has that edit masked by the overlay, so it is
# not itself reviewed. Edits to .github/review-modes/** stay in the diff and are
# reviewed as code. That is a fair trade for being able to select a mode at all. On a
# pull request the prompt is always main's (see TRUST), so a pull request that
# edits .github/review-modes/** is reviewed under main's prompt, not its own;
# the edit takes effect for reviews once it has merged.
#
# IDENTITY MATTERS. A pull request opened with the built-in GITHUB_TOKEN is
# authored by github-actions[bot], and Copilot does not review it: measured
# directly, the identical diff into the identical base got no review as the bot
# (PR #39) and a review in under two minutes as a real user (PR #41). So the
# pull request is created with COPILOT_REVIEW_PAT, a token belonging to someone
# holding a Copilot seat. It should be a fine-grained token with the org as
# resource owner, repository access limited to this repository and REVIEW_REPO,
# and Contents, Pull requests and Workflows read/write. Workflows, because the
# snapshot carries whatever the range does, and a token without it is refused
# the moment a range touches .github/workflows/**. A classic token with `repo`
# and `workflow` also works, but reaches every repository its owner can.
# Without that secret the workflow still runs and still cleans up, but the
# review will not arrive, and the job summary says so rather than implying the
# range came back clean.
#
# TRUST. Pull requests arrive through `pull_request_target`, so the workflow
# that runs with COPILOT_REVIEW_PAT is always main's copy, never the pull
# request's. The checkout is pinned to the pull request's base commit on main,
# and everything executed afterwards -- compose.sh, the drift check -- comes
# from that tree. The pull request's head is fetched as git objects only: it
# is read with merge-base, diff, log and read-tree, and its tree is written
# into a new commit for the scratch branch, but it is never checked out into
# the working tree and nothing in it is run. No step interpolates a pull
# request's title, body or branch name into a shell; the values a step needs
# reach it through env. Fork pull requests are skipped before the job starts.

on:
  # `pull_request_target`, not `pull_request`: the workflow and prompt come
  # from main rather than from the pull request. See TRUST above.
  pull_request_target:
    branches: [main]
    # No `paths:` filter: it would gate `labeled` as well, so the label could
    # never ask for a review of a pull request outside the list. The path
    # check runs inside the job instead. `edited` is here only for a pull
    # request retargeted onto main; the job's `if:` drops title and body
    # edits. `unlabeled` and `converted_to_draft` are left out; they change
    # nothing worth reviewing.
    types: [opened, synchronize, reopened, ready_for_review, labeled, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Review style
        type: choice
        required: false
        default: code
        options:
          - code
          - security
          - full
      ref:
        description: Commit to review (defaults to the last commit on the branch)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  # Applied to every scratch pull request so they can be filtered out of, or
  # into, a search: `is:pr label:automated-review`.
  REVIEW_LABEL: automated-review
  # Where the scratch branches are pushed and the scratch pull request is
  # opened, reviewed and closed. `security` and `full` only run when this is a
  # private repository; see "Check the review target" below.
  REVIEW_REPO: ${{ vars.REVIEW_REPO || github.repository }}

jobs:
  review:
    # Drops pull request runs that should never start, without a runner, and
    # shows them as skipped: fork pull requests (only same-repository pull
    # requests ever reach a step holding COPILOT_REVIEW_PAT), drafts
    # (`ready_for_review` picks them up later), any label other than
    # `security-review` being added, and any edit other than a change of
    # base. `changes.base` is only in the payload when the base changed, so a
    # title or body edit evaluates to null here and is dropped.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        (github.event.action != 'labeled' || github.event.label.name == 'security-review') &&
        (github.event.action != 'edited' || github.event.changes.base.ref.from))
    # Job level, not workflow level: a workflow-level group is joined before
    # the job's `if:` is evaluated, so a run that is about to skip itself could
    # still cancel one that is doing real work. One group per pull request, so
    # a new push supersedes the run reviewing the old head. Every other run
    # gets a group of its own. Nothing here depends on how a cancelled run and
    # its successor interleave: scratch branch names are per run, so a
    # cancelled run's cleanup can only ever delete its own.
    concurrency:
      group: ${{ github.event.pull_request.number && format('copilot-review-pr-{0}', github.event.pull_request.number) || format('copilot-review-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pick the review mode
        id: mode
        env:
          # A pull request is here for a security review; code review of every
          # pull request already comes from the Copilot code review ruleset. A
          # manual run defaults to the cheap, high-signal review; anything
          # heavier is asked for deliberately.
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request_target" ]; then
            mode=security
          else
            mode="${REQUESTED:-code}"
          fi
          case "$mode" in
            code)     label="Code review";                     timeout=420 ;;
            security) label="Security review";                 timeout=600 ;;
            full)     label="Full review (code + security)";   timeout=600 ;;
            *)
              echo "unknown mode: $mode" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "timeout=$timeout" >>"$GITHUB_OUTPUT"
          echo "Review mode: $mode ($label)"

      # Runs first and uses only GITHUB_TOKEN, so a pull request that does not
      # qualify never touches COPILOT_REVIEW_PAT and ends as "not requested"
      # rather than as a refusal further down. It reads the changed files from
      # the API rather than `git diff`, so a pull request that does not qualify
      # never pays for a full-history clone of the vendored trees.
      - name: Check the pull request needs a security review
        id: trigger
        env:
          EVENT: ${{ github.event_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'security-review') }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A manual run is a deliberate request, usually to re-review something
          # under a heavier mode. Do not second-guess it.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$LABELED" = "true" ]; then
            echo "security-review label present"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The files API lists at most 3000 files, and `changed_files` stops
          # counting at 3000 too, so at 3000 the list may be incomplete. Such a
          # pull request is reviewed rather than assumed clean. That catches
          # most subtree pulls, and is intended.
          if [ "$CHANGED_FILES" -ge 3000 ]; then
            echo "$CHANGED_FILES files changed, at the limit the API can list; reviewing"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # A failure to list the files fails the step: an unknown file list
          # is not a clean one. A rename counts under both its old and its
          # new path, so moving a file out of a sensitive area still matches.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                    --jq '.[] | .filename, (.previous_filename // empty)')

          # The sensitive paths. Keep in step with the areas the reviewing
          # guidance singles out: .github/instructions/*.instructions.md and
          # the "Where the bugs are" section of .github/review-modes/security.md.
          # In `case`, `*` also matches `/`, so `dir/*` covers everything
          # below dir.
          sensitive=0
          while IFS= read -r path; do
            case "$path" in
              zeronym/* \
              | .github/workflows/* | .githooks/* \
              | zebra/zebra-chain/* | zebra/zebra-consensus/* \
              | zebra/zebra-script/* | zebra/zebra-network/* \
              | zcashd/src/consensus/* | zcashd/src/primitives/* \
              | zcashd/src/script/* | zcashd/src/crypto/* | zcashd/src/rust/* \
              | zcashd/src/main.cpp | zcashd/src/serialize.h \
              | librustzcash/zcash_primitives/* | librustzcash/zcash_proofs/* \
              | librustzcash/zcash_transparent/* | librustzcash/zcash_keys/* \
              | librustzcash/components/* \
              | orchard/src/*)
                echo "sensitive path changed: $path"
                sensitive=1
                break
                ;;
            esac
          done <<<"$files"

          if [ "$sensitive" = "0" ]; then
            echo "No sensitive paths changed and no \`security-review\` label; security review not requested." \
              >>"$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"

      # Decides where the review may go before anything is cloned or pushed.
      # `security` and `full` output may only ever land in a private
      # repository, so they need REVIEW_REPO to report itself private, read
      # fresh on every run. Anything short of a definite "private" -- internal,
      # public, a 404, an API error -- counts as not private. A refusal is a
      # clean skip with the reason in the job summary, never a fallback to
      # somewhere else.
      - name: Check the review target
        id: target
        if: steps.trigger.outputs.run == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          HAVE_PAT: ${{ secrets.COPILOT_REVIEW_PAT != '' }}
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # An admin-set value that is not owner/name is a configuration
          # error. Fail loudly rather than skip.
          if ! [[ "$REVIEW_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "REVIEW_REPO '$REVIEW_REPO' is not of the form owner/name" >&2
            exit 1
          fi

          refuse() {
            echo "run=false" >>"$GITHUB_OUTPUT"
            {
              printf 'Mode: `%s` -- not run.\n\n' "$MODE"
              printf 'Reason: %s.\n\n' "$1"
              if [ "$MODE" = "security" ] || [ "$MODE" = "full" ]; then
                printf 'Security reviews are skipped, not published, until a private\n'
                printf 'REVIEW_REPO is configured. See the note at the top of the workflow.\n'
              fi
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # GitHub names are case-insensitive. GITHUB_TOKEN only reaches this
          # repository, so any other target needs the PAT.
          if [ "${REVIEW_REPO,,}" != "${THIS_REPO,,}" ] && [ "$HAVE_PAT" != "true" ]; then
            refuse "COPILOT_REVIEW_PAT is not available"
          fi

          # Not `|| true` on the substitution: on an error gh prints the error
          # body to stdout, which would land in `vis`. Any failure means empty.
          if ! vis=$(gh api "repos/$REVIEW_REPO" --jq .visibility 2>/dev/null); then
            vis=""
          fi
          # Unknown visibility refuses in every mode, so a private target is
          # never handled as a public one.
          if [ -z "$vis" ]; then
            refuse "could not read REVIEW_REPO's visibility (not visible to the token, or does not exist)"
          fi
          private=false
          if [ "$vis" = "private" ]; then
            private=true
          fi

          if [ "$MODE" = "security" ] || [ "$MODE" = "full" ]; then
            if [ "$private" != "true" ]; then
              refuse "REVIEW_REPO visibility is \`$vis\`, not private"
            fi
          fi

          {
            echo "run=true"
            echo "private=$private"
            echo "remote=${GITHUB_SERVER_URL}/${REVIEW_REPO}.git"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.target.outputs.run == 'true' && steps.trigger.outputs.run == 'true'
        # Pinned by SHA, not tag: this job holds contents:write and
        # pull-requests:write, and a tag can be moved under it.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request checks out its base commit on main, so every script
          # run below is main's. The head is fetched as data in the range step
          # and never checked out. A manual run leaves this empty and gets the
          # default, the commit it was dispatched on.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # The credential git pushes with, not just the one `gh` calls with.
          # checkout persists whatever it is given, so leaving this at the
          # default makes every `git push` below act as the GitHub App, and the
          # App is refused outright when the pushed range touches
          # .github/workflows/** -- which is exactly what this workflow's own
          # commits do. GITHUB_TOKEN can never be granted that permission, so
          # the PAT has to own the push as well as the pull request.
          token: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}

      # The checked-in instructions file is what a human-opened pull request
      # gets reviewed against, and it is generated from the same fragments. If
      # it has drifted, real pull requests are being reviewed against a stale
      # prompt. Say so, but do not fail this run over it -- the run composes its
      # own copy and is unaffected.
      - name: Check the checked-in instructions are in sync
        id: drift
        if: steps.target.outputs.run == 'true' && steps.trigger.outputs.run == 'true'
        continue-on-error: true
        run: .github/review-modes/compose.sh --check code

      - name: Decide the range to review
        id: gate
        if: steps.target.outputs.run == 'true' && steps.trigger.outputs.run == 'true'
        env:
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_INPUT: ${{ github.event.inputs.ref }}
          PR: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A skip is visible in the job summary as well as the log. The
          # reason names commits only, never anything from a review.
          skip() {
            echo "$1; skipping"
            printf 'Range check: %s; not reviewed.\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          }

          after="$AFTER"
          if [ "$EVENT" = "pull_request_target" ]; then
            # The whole pull request as GitHub shows it: from its merge base
            # with main to its head. The checkout is the base commit with full
            # history; the head is fetched as objects only, never checked out.
            # A failed fetch fails the step: an unreadable head is not a clean
            # one.
            git fetch --no-tags --quiet origin "$PR_HEAD"
            after="$PR_HEAD"
            if ! before=$(git merge-base "$PR_BASE" "$PR_HEAD"); then
              skip "no merge base between $PR_BASE and $PR_HEAD"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual runs review one commit, so the workflow can be tested
            # without pushing anything, and so an older commit can be re-reviewed
            # under a different mode.
            if [ -n "$REF_INPUT" ]; then
              # --verify -q, not a bare rev-parse. Given a value starting with
              # `-`, bare rev-parse neither resolves it nor fails: it echoes the
              # argument back and exits 0, so `set -e` never fires and the bogus
              # string flows on into `before`, cat-file rejects it, and the run
              # ends as a green "base commit is not present; skipping" having
              # reviewed nothing. A workflow that silently does not run is the
              # one failure mode worth engineering against here.
              #
              # `--` is NOT the guard for this: in rev-parse it separates revs
              # from paths, so `git rev-parse -- "$x"` resolves nothing at all.
              if ! after=$(git rev-parse --verify -q "${REF_INPUT}^{commit}"); then
                echo "ref input '${REF_INPUT}' is not a commit in this repository" >&2
                exit 1
              fi
            fi
            before=$(git rev-parse "${after}~1")
          fi

          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            skip "base commit $before is not present"
          fi

          if [ "$before" = "$after" ]; then
            skip "nothing new"
          fi

          changed=$(git diff --name-only "$before" "$after" | wc -l | tr -d ' ')
          if [ "$changed" -eq 0 ]; then
            skip "empty diff"
          fi

          echo "base=$before" >>"$GITHUB_OUTPUT"
          echo "head=$after" >>"$GITHUB_OUTPUT"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          # Names this run's scratch branches. Unique per run and attempt, so
          # no two runs ever share a branch.
          echo "key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
          # What the scratch pull request says it reviews. Deliberately never
          # `#N` or owner/repo#N, so nothing autolinks inside REVIEW_REPO.
          if [ "$EVENT" = "pull_request_target" ]; then
            subject="pr-${PR}"
          else
            subject="main $(git rev-parse --short "$after")"
          fi
          echo "subject=$subject" >>"$GITHUB_OUTPUT"
          echo "run=true" >>"$GITHUB_OUTPUT"

      - name: Open the review pull request
        if: steps.gate.outputs.run == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          REMOTE: ${{ steps.target.outputs.remote }}
          BASE_SHA: ${{ steps.gate.outputs.base }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          CHANGED: ${{ steps.gate.outputs.changed }}
          KEY: ${{ steps.gate.outputs.key }}
          SUBJECT: ${{ steps.gate.outputs.subject }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_LABEL: ${{ steps.mode.outputs.label }}
          GIT_AUTHOR_NAME: copilot-review
          GIT_AUTHOR_EMAIL: copilot-review@users.noreply.github.com
          GIT_COMMITTER_NAME: copilot-review
          GIT_COMMITTER_EMAIL: copilot-review@users.noreply.github.com
        run: |
          set -euo pipefail
          short_head=$(git rev-parse --short "$HEAD_SHA")
          short_base=$(git rev-parse --short "$BASE_SHA")
          # Per run, so concurrent runs never share a branch. Not
          # copilot-review-base/...: a branch named copilot-review-base already
          # exists here, and git cannot hold a ref and a directory of refs under
          # the same name.
          base_branch="copilot-review/base-${KEY}"
          head_branch="copilot-review/head-${KEY}"

          # The mode's prompt, composed from the fragments on the checked-out
          # tip -- never from whatever the reviewed range happens to contain.
          instructions="$RUNNER_TEMP/copilot-instructions.md"
          .github/review-modes/compose.sh "$MODE" >"$instructions"
          blob=$(git hash-object -w "$instructions")

          # Lay that one file over a commit's tree without touching the working
          # tree, by building the new tree in a scratch index.
          #
          # `from` is the commit the tree comes from; `parent` is what the new
          # commit descends from. They differ for the head snapshot, and that
          # difference is the whole point: GitHub shows a pull request the
          # THREE-dot diff, from the merge base to the head. If the head
          # snapshot kept its real parent, the merge base would be BASE_SHA
          # itself, the base branch's overlay commit would not be an ancestor of
          # the head, and the instructions file would show up as a change --
          # measured directly, Copilot reported "Files reviewed: 2/2" and
          # summarized the instructions file as part of the change. Parenting
          # the head snapshot onto the base commit makes the merge base exactly
          # that commit, so three-dot and two-dot agree and the identical blob
          # on both sides cancels out.
          overlay() {
            local from=$1 parent=$2 msg=$3 idx tree
            idx="$RUNNER_TEMP/index.$$"
            rm -f "$idx"
            GIT_INDEX_FILE="$idx" git read-tree "$from"
            GIT_INDEX_FILE="$idx" git update-index --add \
              --cacheinfo "100644,${blob},.github/copilot-instructions.md"
            tree=$(GIT_INDEX_FILE="$idx" git write-tree)
            rm -f "$idx"
            git commit-tree "$tree" -p "$parent" -m "$msg"
          }

          base_commit=$(overlay "$BASE_SHA" "$BASE_SHA" "Review instructions: ${MODE}")

          # The head snapshot is therefore one squashed commit rather than the
          # range's own commits. Copilot reviews the diff, not the history, but
          # the subjects are still useful context, so carry them in the message.
          head_msg=$(printf '%s\n\n%s\n' \
            "Reviewed range: ${short_base}..${short_head}" \
            "$(git log -n 50 --format='%h %s' "${BASE_SHA}..${HEAD_SHA}")")
          head_commit=$(overlay "$HEAD_SHA" "$base_commit" "$head_msg")

          # Recorded BEFORE anything is pushed, so that a failure on either push
          # or in `gh pr create` still leaves the cleanup step both names to
          # delete. Keyed off the pull request number instead, a failure before
          # creation would strand the branches.
          echo "base_branch=$base_branch" >>"$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >>"$GITHUB_OUTPUT"

          # REMOTE is a plain https URL with no credential in it. git
          # authenticates to it through the http.https://github.com/.extraheader
          # that actions/checkout v4 persists, which applies to every
          # https://github.com/* remote. Recheck this on a checkout bump.
          #
          # The scratch base: exactly where the range starts.
          git push --force "$REMOTE" "${base_commit}:refs/heads/${base_branch}"
          git push --force "$REMOTE" "${head_commit}:refs/heads/${head_branch}"

          body=$(printf '%s\n' \
            "Automated Copilot review of \`${SUBJECT}\`." \
            "" \
            "Range: \`${short_base}..${short_head}\` (${CHANGED} files)" \
            "Mode: \`${MODE}\` — ${MODE_LABEL}" \
            "" \
            "**This pull request is scratch and is closed automatically. Do not merge it.**")

          # Ensure the label exists before it is applied. This errors once the
          # label is present, which is the normal case, so the failure is
          # tolerated rather than treated as a problem.
          gh label create "$REVIEW_LABEL" \
            --repo "$REVIEW_REPO" \
            --color 0E8A16 \
            --description "Scratch PR opened by the Copilot Review workflow; auto-closed, never merged" \
            >/dev/null 2>&1 || true

          pr_url=$(gh pr create \
            --repo "$REVIEW_REPO" \
            --base "$base_branch" \
            --head "$head_branch" \
            --title "Copilot ${MODE} review: ${SUBJECT} ${short_base}..${short_head}" \
            --label "$REVIEW_LABEL" \
            --body "$body")

          pr_number=$(basename "$pr_url")
          echo "number=$pr_number" >>"$GITHUB_OUTPUT"
          echo "url=$pr_url" >>"$GITHUB_OUTPUT"
          echo "range=${short_base}..${short_head}" >>"$GITHUB_OUTPUT"

      # Belt and braces. If the ruleset covers this base branch the review is
      # requested automatically and this is a no-op; if it does not, this asks
      # explicitly. Failure is tolerated so a permissions quirk cannot fail the
      # run before the wait step has had a chance.
      - name: Ask Copilot to review
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo '{"reviewers":["copilot-pull-request-reviewer[bot]"]}' \
            | gh api "repos/$REVIEW_REPO/pulls/$PR/requested_reviewers" -X POST --input - >/dev/null || true

      - name: Wait for the review, then record it
        if: steps.pr.outputs.number != ''
        id: wait
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          PR: ${{ steps.pr.outputs.number }}
          RANGE: ${{ steps.pr.outputs.range }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SUBJECT: ${{ steps.gate.outputs.subject }}
          PRIVATE: ${{ steps.target.outputs.private }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_LABEL: ${{ steps.mode.outputs.label }}
          REVIEW_TIMEOUT_SECONDS: ${{ steps.mode.outputs.timeout }}
          DRIFT: ${{ steps.drift.outcome }}
          HAVE_PAT: ${{ secrets.COPILOT_REVIEW_PAT != '' }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + REVIEW_TIMEOUT_SECONDS ))
          found=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(gh api "repos/$REVIEW_REPO/pulls/$PR/reviews" \
                  --jq '[.[] | select(.user.login | test("copilot";"i"))] | length' 2>/dev/null || echo 0)
            if [ "$n" != "0" ]; then
              found=1
              break
            fi
            sleep 20
          done

          {
            printf '# %s of `%s` %s\n\n' "$MODE_LABEL" "$SUBJECT" "$RANGE"
            printf 'Mode: `%s`\n\n' "$MODE"
            if [ "$DRIFT" = "failure" ]; then
              printf '> **Note:** `.github/copilot-instructions.md` is out of sync with\n'
              printf '> `.github/review-modes/`. This run composed its own prompt and is\n'
              printf '> unaffected, but human-opened pull requests are being reviewed against\n'
              printf '> the stale file. Regenerate it with\n'
              printf '> `.github/review-modes/compose.sh code > .github/copilot-instructions.md`.\n\n'
            fi
            if [ "$found" = "0" ]; then
              printf '**No review arrived within %ss.**\n\n' "$REVIEW_TIMEOUT_SECONDS"
              printf 'This is a reviewer failure, not a clean review: nothing was checked.\n\n'
              if [ "$HAVE_PAT" != "true" ]; then
                printf 'The COPILOT_REVIEW_PAT secret is not set, so the pull request was opened\n'
                printf 'by github-actions[bot], which Copilot does not review. That is the most\n'
                printf 'likely cause here. See the note at the top of the workflow.\n'
              else
                printf 'Check whether Copilot code review is enabled for the `copilot-review/base-*`\n'
                printf 'branches of `%s`, whether the token owner holds a Copilot seat, and\n' "$REVIEW_REPO"
                printf 'whether GitHub reports a Copilot incident.\n'
              fi
            # A private target keeps the review where it was written. This run
            # records only that it arrived and where. Nothing derived from a
            # review body or comment -- text, path, line or count -- may be
            # written to the summary, echoed, or exposed with `set -x` here.
            elif [ "$PRIVATE" = "true" ]; then
              printf 'Review arrived.\n'
            else
              printf '## Summary\n\n'
              gh api "repos/$REVIEW_REPO/pulls/$PR/reviews" \
                --jq '.[] | select(.user.login | test("copilot";"i")) | .body' \
                | sed 's/^/> /'
              printf '\n## Inline findings\n\n'
              count=$(gh api "repos/$REVIEW_REPO/pulls/$PR/comments" \
                        --jq '[.[] | select(.user.login | test("copilot";"i"))] | length')
              if [ "$count" = "0" ]; then
                printf '_No inline findings._\n'
              else
                gh api "repos/$REVIEW_REPO/pulls/$PR/comments" \
                  --jq '.[] | select(.user.login | test("copilot";"i"))
                        | "### `\(.path):\(.line // .original_line)`\n\n\(.body)\n"'
              fi
            fi
            if [ "$PRIVATE" = "true" ]; then
              printf '\nReview retained on %s (private).\n' "$PR_URL"
            else
              printf '\nReviewed on %s (closed automatically).\n' "$PR_URL"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          echo "found=$found" >>"$GITHUB_OUTPUT"

      # Always runs, so a timeout, a failure or a cancellation above still
      # cleans up rather than leaving scratch pull requests and branches behind.
      - name: Close the review pull request and delete the snapshot
        if: always() && (steps.pr.outputs.head_branch != '' || steps.pr.outputs.base_branch != '')
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_PAT || github.token }}
          REMOTE: ${{ steps.target.outputs.remote }}
          PRIVATE: ${{ steps.target.outputs.private }}
          PR: ${{ steps.pr.outputs.number }}
          BASE_BRANCH: ${{ steps.pr.outputs.base_branch }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            if [ "$PRIVATE" = "true" ]; then
              comment="Review retained on this closed pull request. Never merged."
            else
              comment="Recorded in the workflow run summary. Closing; this pull request is never merged."
            fi
            gh pr close "$PR" --repo "$REVIEW_REPO" --comment "$comment" || true
          fi
          # One push per ref: a ref that was never created must not block
          # deleting the other.
          git push "$REMOTE" --delete "$HEAD_BRANCH" || true
          git push "$REMOTE" --delete "$BASE_BRANCH" || true
