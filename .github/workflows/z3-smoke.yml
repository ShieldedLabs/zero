name: Z3 stack smoke test

# Build the Z3 stack images (zebra, zaino, zallet) from vendored source and
# prove the deploy/z3-stack/ bundle works end to end: zebra healthy, zaino
# serving lightwalletd gRPC, zallet answering wallet RPC with a node tip, no
# crash-loops, nothing exposed that shouldn't be. None of the checks need a
# synced chain, so the smoke phase takes minutes; the builds dominate.
#
# Each component builds in its own matrix job (= a separate GitHub job with
# its own success, cache export, and artifact), so a failure in one build or
# in the downstream smoke job never discards another component's cached
# layers or built image. Compile stages are always rebuilt fresh
# (no-cache-filters): a smoke run must never test a stale binary (observed
# 2026-07-17: a cached COPY layer served an image without the commit under
# test). The fresh build is made affordable by the 16-vCPU runner and by the
# three components building in parallel; base and apt layers still come from
# cache. Each build hands its exact image to the smoke job as an artifact, so
# smoke never rebuilds.
#
# Build definitions mirror deploy/z3-stack/docker-compose.build.yml; keep them
# in sync if you change contexts, Dockerfiles, or build args.

on:
  # Deliberately no `paths:` filter; the equivalent list lives in the `changes`
  # job below. PR #20 (the zebra security subtree update, 2026-08-06) changed
  # 144 files, 107 of which matched the vendored-source patterns that used to
  # sit here, and GitHub created no Actions check suite for it at all: the
  # pull_request event produced zero workflow runs, so the PR merged with no CI
  # and nothing on the PR page said so. Nothing about the PR explains it: the
  # diff was well inside every documented path-filter limit (144 files, 19
  # commits), GitHub's own compare API returns the same 144 files, and the
  # workflow file was byte-identical at base and head. Actions was visibly
  # unhealthy that afternoon (the v25 release dispatched 75 minutes later sat
  # queued with no jobs and never started; v25 shipped from a re-dispatch the
  # next day), so the likeliest reading is a transient failure to evaluate the
  # trigger.
  #
  # Transient is the problem, not the excuse. A path-filtered workflow that
  # does not trigger is indistinguishable from one that passed, so a dropped
  # event is silent and there is nothing to notice. Filtering in a job instead
  # makes the decision ours and puts it in a log, and the `required` job at the
  # bottom reports on every PR either way. Require that check in branch
  # protection and a dropped event blocks the merge instead of vanishing.
  pull_request:
  workflow_dispatch:
  # Called by release.yml: every release is gated on a green smoke run of the
  # exact commit being released. Added 2026-07-22 after v21 nearly shipped
  # zebra security carries whose PR matched none of the path filters, so no
  # smoke ran before the release was dispatched. This gate has now caught the
  # same class of miss twice; keep it even though the PR side is fixed.
  workflow_call:
  schedule:
    # Weekly: catches interop breakage that reaches the stack through a path
    # the gate below does not watch.
    - cron: "17 6 * * 1"

# packages: write is for pushing the GHCR build cache; on fork PRs GitHub
# forces the token to read-only, which is fine because PR runs write the
# ephemeral GHA cache instead (see the cache-to expression below).
permissions:
  contents: read
  packages: write

jobs:
  # What the `paths:` filter used to do, for about 20 seconds of a
  # ubuntu-latest runner. The workflow now registers on every PR, so the check
  # suite always exists; this job decides whether the three 45-minute builds
  # are worth running.
  changes:
    name: Path gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On pull_request, HEAD is the merge commit GitHub built from the PR;
          # depth 2 is all it takes to diff it against the base it was merged
          # onto, which is exactly the net change the PR lands.
          fetch-depth: 2

      - name: Decide whether this PR can reach the z3 stack
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Every non-PR event builds unconditionally. In particular the
          # workflow_call from release.yml must never be short-circuited by a
          # path decision: that gate is the backstop this workflow failed to be.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Event \`$EVENT_NAME\`: building unconditionally." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The list the `paths:` block used to hold, unchanged and in the same
          # order. `:(glob)` gives git the semantics GitHub's filter patterns
          # use (`*` stops at a slash, `**` spans directories), so the two
          # forms stay line-for-line comparable.
          specs=(
            ':(glob)deploy/z3-stack/**'
            ':(glob)zebra/docker/Dockerfile'
            ':(glob)zebra/docker/entrypoint.sh'
            ':(glob)zaino/Dockerfile'
            ':(glob)zaino/entrypoint.sh'
            ':(glob)zallet/Dockerfile'
            ':(glob).github/workflows/z3-smoke.yml'
            ':(glob)qa/log-filter-injection-test.sh'
            # Vendored source that ends up in the shipped binaries. Without
            # these, a PR that changes consensus or wallet code but no
            # Dockerfile runs no stack CI at all: that is how v21's zebra
            # security carries reached the release dispatch untested. Scoped to
            # crate sources rather than the whole subtree so book/, docs, and
            # CHANGELOG edits do not trigger a full three-image build.
            ':(glob)zebra/zebra-*/**'
            ':(glob)zebra/zebrad/**'
            ':(glob)zebra/Cargo.toml'
            ':(glob)zebra/Cargo.lock'
            ':(glob)zaino/packages/**'
            ':(glob)zaino/Cargo.toml'
            ':(glob)zaino/Cargo.lock'
            ':(glob)zallet/zallet*/**'
            ':(glob)zallet/backends/**'
            ':(glob)zallet/Cargo.toml'
            ':(glob)zallet/Cargo.lock'
          )

          # Fail open. If the merge commit is not there to diff (a checkout
          # race, a head that is not a merge), build rather than skip: the
          # whole point of this job is that "we could not tell" must never
          # silently mean "no CI".
          if ! git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not diff the merge commit against its base; building unconditionally"
            echo "Could not diff the merge commit; building unconditionally." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD -- "${specs[@]}" > "$RUNNER_TEMP/matched"

          total=$(( $(wc -l < "$RUNNER_TEMP/changed") ))
          hits=$(( $(wc -l < "$RUNNER_TEMP/matched") ))
          if [ "$hits" -gt 0 ]; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

          {
            echo "### z3 stack path gate"
            echo
            echo "\`$total\` file(s) changed, \`$hits\` of them reaching the z3 stack."
            echo
            if [ "$relevant" = true ]; then
              echo "Building. First 25 matches:"
              echo
              echo '```'
              head -25 "$RUNNER_TEMP/matched"
              echo '```'
            else
              echo "Nothing here reaches the shipped binaries or the deploy bundle; skipping the builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Seconds-long checks that need no build, run before the three 45-minute
  # image builds so an obvious regression fails the PR immediately instead of
  # after the matrix. Deliberately not a `needs:` dependency of the builds:
  # these are independent signals, and blocking a 45-minute build on a shell
  # test would trade fast feedback for slow feedback.
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Covers the [upstream-pending #11050] carry. zebra-utils scripts are
      # not in the runtime image, so this cannot be a stack probe.
      - name: zebrad-log-filter shell-injection regression test
        run: ./qa/log-filter-injection-test.sh

  # One separate job per component (matrix legs are independent jobs). Each
  # builds its image FRESH, exports its build cache (base/apt layers warm the
  # next run), and uploads the exact image it built as an artifact for the
  # smoke job. `fail-fast: false` keeps a failure in one component from
  # cancelling the others, so their caches and artifacts still land.
  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    # Cache-warm-only legs (nothing downstream consumes their image) must not
    # be able to redden the stack gate: a GHCR throttle on a cache pull held
    # every PR hostage for an afternoon (2026-09-01, zero-zcashd buildcache).
    continue-on-error: ${{ matrix.cache_warm_only || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zero-zebra
            context: zebra
            dockerfile: zebra/docker/Dockerfile
            build_args: |
              FEATURES=release_max_level_info,progress-bar,prometheus
            no_cache_filters: release
            smoke_image: true
          - name: zero-zaino
            context: zaino
            dockerfile: zaino/Dockerfile
            build_args: |
              NO_TLS=true
            rust_toolchain_file: zaino/rust-toolchain.toml
            no_cache_filters: builder
            smoke_image: true
          - name: zero-zallet
            context: zallet
            dockerfile: zallet/Dockerfile
            build_args: |
              BACKEND=zaino
              FEATURES=rpc-cli,zcashd-import
            no_cache_filters: builder
            smoke_image: true
          # Not part of the z3 stack; built here only to keep its build cache
          # warm (registry cache entries are refreshed only when read, and
          # zcashd is otherwise built solely on releases). Cache-warm only: no
          # no-cache-filters, no artifact, not consumed by smoke.
          - name: zero-zcashd
            context: zcashd
            dockerfile: docker/zcashd/Dockerfile
            build_args: ""
            no_cache_filters: ""
            smoke_image: false
            cache_warm_only: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Needed to push the GHCR build cache; pulls of the public cache refs
      # are anonymous. On fork PRs the token is read-only, but those runs
      # don't write to the registry (see cache-to below).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: args
        run: |
          set -euo pipefail
          {
            echo "build_args<<BUILD_ARGS_EOF"
            printf '%s\n' "${{ matrix.build_args }}"
            if [ -n "${{ matrix.rust_toolchain_file }}" ]; then
              rv=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                   "${{ matrix.rust_toolchain_file }}" | head -n1)
              if ! [[ "$rv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::error::unexpected channel '${rv}' in ${{ matrix.rust_toolchain_file }}"
                exit 1
              fi
              echo "RUST_VERSION=${rv}"
            fi
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Authoritative build. `load` puts the image in this job's Docker daemon
      # so it can be saved as an artifact; the compile stage is rebuilt fresh
      # (no-cache-filters) for correctness; cache-to warms the cheap layers.
      # Cache refs are hardcoded lowercase (registry rejects the uppercase in
      # github.repository_owner). PR runs (read-only token) write the GHA
      # cache instead of the registry; every run reads both.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          load: ${{ matrix.smoke_image }}
          tags: ghcr.io/shieldedlabs/${{ matrix.name }}:smoke
          build-args: ${{ steps.args.outputs.build_args }}
          no-cache-filters: ${{ matrix.no_cache_filters }}
          cache-from: |
            type=registry,ref=ghcr.io/shieldedlabs/${{ matrix.name }}:buildcache
            type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.name) || format('type=registry,ref=ghcr.io/shieldedlabs/{0}:buildcache,mode=max,image-manifest=true', matrix.name) }}

      # Hand the exact built image to the smoke job. Artifacts (not a GHCR
      # push) so this works unchanged on fork PRs, where the token cannot
      # push images.
      - name: Export image artifact
        if: matrix.smoke_image
        run: |
          set -euxo pipefail
          docker save "ghcr.io/shieldedlabs/${{ matrix.name }}:smoke" \
            | zstd -T0 -3 > "${{ runner.temp }}/${{ matrix.name }}.tzst"

      - name: Upload image artifact
        if: matrix.smoke_image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tzst
          retention-days: 1
          if-no-files-found: error

  smoke:
    needs: build
    # GitHub-hosted, NOT Blacksmith: zebra's mainnet P2P starves on Blacksmith
    # runners (peer handshakes succeed but no block ever downloads; observed
    # twice 2026-07-17, zebra pinned at Height(0) for the whole probe window,
    # which starves zaino's chain index and every downstream probe). The probes
    # are cheap; only the builds need the big runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZERO_IMAGE_TAG: smoke
    defaults:
      run:
        working-directory: deploy/z3-stack
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download stack images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load stack images
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          for f in "${{ runner.temp }}"/images/*.tzst; do
            zstd -d -c "$f" | docker load
          done
          docker image ls | grep shieldedlabs

      # All probe logic lives in deploy/z3-stack/smoke.sh (single source of
      # truth, also runnable locally against docker-compose.build.yml images
      # for ~2-minute iteration). The script prints one ok:/FAIL: line per
      # probe and dumps container state itself when a probe fails.
      - name: Wallet init, stack up, smoke probes
        run: ./smoke.sh --init --up

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps || true
          # Full logs per container, not a tail: a crash-looping container
          # keeps every restart's output in one log, and the interesting
          # part (the first crash) is at the top.
          for c in zebra zaino zallet; do
            echo "::group::$c (RestartCount=$(docker inspect --format '{{.RestartCount}}' "$c" 2>/dev/null || echo '?'))"
            docker logs "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # The single check to require in branch protection. It reports on every PR,
  # including the ones the gate skipped, so "the workflow never ran" can never
  # again be indistinguishable from "the workflow passed". A skipped build is a
  # pass here; only a real failure or a cancellation fails it.
  required:
    name: z3 stack smoke result
    needs: [changes, quick-checks, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r 'to_entries[]
                       | select(.value.result == "failure" or .value.result == "cancelled")
                       | .key' <<< "$NEEDS" | paste -sd, -)
          if [ -n "$bad" ]; then
            echo "::error::z3-smoke jobs failed or were cancelled: ${bad}"
            exit 1
          fi
