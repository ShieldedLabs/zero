name: Z3 stack smoke test

# Builds the Z3 stack images (zebra, zaino, zallet) from vendored source and
# proves deploy/z3-stack/ works end to end (probes: deploy/z3-stack/smoke.sh).
# A pull request builds only the images whose build context it touches and
# reuses the rest from ghcr.io/shieldedlabs/<image>:main, the newest main
# build that passed this test; every other event builds everything.

on:
  # No `paths:` filter: a workflow that does not trigger is indistinguishable
  # from one that passed (PR #20 merged with no CI that way). The gate job
  # filters instead, and `required` reports on every PR.
  pull_request:
  # Smokes every merge and refreshes the :main images.
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml gates every release on this workflow.
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  changes:
    name: Path gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
      reuse: ${{ steps.gate.outputs.reuse }}
      zcashd: ${{ steps.gate.outputs.zcashd }}
    steps:
      # One filter per image: its build context as the component's
      # .dockerignore defines it, plus the Dockerfile; keep the two in step.
      # A missed path means a green smoke against a reused image that lacks
      # the change. Fails open: no file list (API error, or a PR too large
      # for the 3000-file cap of the PR files API), build everything.
      - name: Changed build contexts
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            stack: &stack
              - deploy/z3-stack/**
              - .github/workflows/z3-smoke.yml
              - qa/log-filter-injection-test.sh
            zero-zebra:
              - *stack
              - zebra/.cargo/**
              - zebra/.config/**
              - zebra/*.toml
              - zebra/*.lock
              - zebra/tower-*/**
              - zebra/zebra-*/**
              - zebra/zebrad/**
              - zebra/docker/entrypoint.sh
              - zebra/docker/default-zebra-config.toml
              - zebra/docker/Dockerfile
              - zebra/.dockerignore
            zero-zaino:
              - *stack
              - zaino/**
              - '!zaino/.github/**'
              - '!zaino/docs/**'
              - '!zaino/**/*.md'
            zero-zallet:
              - *stack
              - zallet/.cargo/**
              - zallet/Cargo.toml
              - zallet/Cargo.lock
              - zallet/vendor/**
              - zallet/zallet/**
              - zallet/zallet-core/**
              - zallet/backends/**
              - zallet/tools/**
              - zallet/Dockerfile
              - zallet/.dockerignore
            zcashd:
              - zcashd/**
              - docker/zcashd/**

      - name: Decide per image
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          FILTER: ${{ toJSON(steps.filter.outputs) }}
        run: |
          set -euo pipefail
          build='[]'; reuse='[]'; zcashd=false
          rows="$RUNNER_TEMP/rows"; : > "$rows"
          row() { echo "| $1 | $2 | $3 |" >> "$rows"; }
          changed() { jq -e --arg n "$1" 'any(. == $n)' <<< "$CHANGED" > /dev/null; }
          first() { jq -r --arg k "${1}_files" '.[$k] | fromjson | .[0] | gsub("[|\\r\\n]"; " ")' <<< "$FILTER"; }
          if [ "$EVENT_NAME" = pull_request ]; then zjob="build (non-gating)"; else zjob="warm cache"; fi

          if [ "$FILTER_OUTCOME" != success ]; then
            why="event \`$EVENT_NAME\` builds every image"
            if [ "$EVENT_NAME" = pull_request ]; then
              why="could not list the changed files (filter step: $FILTER_OUTCOME, PR changes $CHANGED_FILES files); building every image"
              echo "::warning::$why"
            fi
            build='["zero-zebra","zero-zaino","zero-zallet"]'; zcashd=true
            for name in zero-zebra zero-zaino zero-zallet; do row "$name" build "$why"; done
            row zero-zcashd "$zjob" "$why"
          else
            for name in zero-zebra zero-zaino zero-zallet; do
              if changed "$name"; then
                build=$(jq -c --arg n "$name" '. + [$n]' <<< "$build")
                row "$name" build "changed: \`$(first "$name")\`"
              fi
            done
            for name in zero-zebra zero-zaino zero-zallet; do
              if changed "$name"; then continue; fi
              if [ "$build" = '[]' ]; then
                row "$name" skip "no stack image changed, no smoke"
                continue
              fi
              # Reuse only what is verifiably there, pinned to the digest seen now.
              ref="ghcr.io/shieldedlabs/$name:main"
              if digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/err"); then
                reuse=$(jq -c --arg n "$name" --arg d "$digest" '. + [{name: $n, digest: $d}]' <<< "$reuse")
                row "$name" reuse "\`$ref@$digest\`"
              else
                build=$(jq -c --arg n "$name" '. + [$n]' <<< "$build")
                row "$name" build "\`$ref\` unavailable, failing open: $(head -n1 "$RUNNER_TEMP/err" | tr '|' '/')"
              fi
            done
            if changed zcashd; then
              zcashd=true; row zero-zcashd "$zjob" "changed: \`$(first zcashd)\`"
            else
              row zero-zcashd skip unchanged
            fi
          fi

          { echo "build=$build"; echo "reuse=$reuse"; echo "zcashd=$zcashd"; } | tee -a "$GITHUB_OUTPUT"
          { echo "### z3 stack path gate"; echo; echo "| image | decision | why |"; echo "|---|---|---|"; cat "$rows"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Covers the [upstream-pending #11050] carry.
      - name: zebrad-log-filter shell-injection regression test
        run: ./qa/log-filter-injection-test.sh

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.build != '[]'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.build) }}
    env:
      # Mirror of deploy/z3-stack/docker-compose.build.yml.
      LEGS: |
        {
          "zero-zebra": {
            "context": "zebra",
            "dockerfile": "zebra/docker/Dockerfile",
            "build_args": "FEATURES=release_max_level_info,progress-bar,prometheus",
            "no_cache_filters": "release"
          },
          "zero-zaino": {
            "context": "zaino",
            "dockerfile": "zaino/Dockerfile",
            "build_args": "NO_TLS=true",
            "rust_toolchain_file": "zaino/rust-toolchain.toml",
            "no_cache_filters": "builder"
          },
          "zero-zallet": {
            "context": "zallet",
            "dockerfile": "zallet/Dockerfile",
            "build_args": "BACKEND=zaino\nFEATURES=rpc-cli,zcashd-import",
            "no_cache_filters": "builder"
          }
        }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RUST_VERSION comes from the vendored rust-toolchain.toml where the
      # Dockerfile has no default.
      - name: Resolve build args
        id: args
        env:
          BUILD_ARGS: ${{ fromJSON(env.LEGS)[matrix.name].build_args }}
          RUST_TOOLCHAIN_FILE: ${{ fromJSON(env.LEGS)[matrix.name].rust_toolchain_file }}
        run: |
          set -euo pipefail
          {
            echo "build_args<<BUILD_ARGS_EOF"
            printf '%s\n' "$BUILD_ARGS"
            if [ -n "$RUST_TOOLCHAIN_FILE" ]; then
              rv=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                   "$RUST_TOOLCHAIN_FILE" | head -n1)
              if ! [[ "$rv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::error::unexpected channel '${rv}' in ${RUST_TOOLCHAIN_FILE}"
                exit 1
              fi
              echo "RUST_VERSION=${rv}"
            fi
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The compile stage is never served from cache (no-cache-filters): a
      # smoke run must never test a stale binary. Only the base and apt
      # layers are cacheable, and every run reads them from the registry
      # cache that main, scheduled, and dispatched runs refresh. PR runs
      # export nothing: the registry cache belongs to main (a fork PR's
      # token could not write it anyway), and exporting to the Actions
      # cache instead filled the repo's 10 GB quota with buildkit blobs
      # (38 entries, 9.9 GB, one blob of 5.5 GB on 2026-09-02) that evicted
      # z3-regtest's rust-cache and golden-chain entries on every PR, while
      # the always-fresh compile stage could never hit them anyway.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ fromJSON(env.LEGS)[matrix.name].context }}
          file: ${{ fromJSON(env.LEGS)[matrix.name].dockerfile }}
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ghcr.io/shieldedlabs/${{ matrix.name }}:smoke
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: ${{ steps.args.outputs.build_args }}
          no-cache-filters: ${{ fromJSON(env.LEGS)[matrix.name].no_cache_filters }}
          cache-from: type=registry,ref=ghcr.io/shieldedlabs/${{ matrix.name }}:buildcache
          # Negated form on purpose: `cond && '' || x` always yields x.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/shieldedlabs/{0}:buildcache,mode=max,image-manifest=true', matrix.name) || '' }}

      # Artifacts, not a registry push: works unchanged on fork PRs.
      - name: Export image artifact
        run: |
          set -euxo pipefail
          docker save "ghcr.io/shieldedlabs/${{ matrix.name }}:smoke" \
            | zstd -T0 -3 > "${{ runner.temp }}/${{ matrix.name }}.tzst"

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tzst
          retention-days: 1
          if-no-files-found: error

  # Not a stack image, and not on the gate: nothing waits on either zcashd
  # job and both may fail, so a slow or throttled zcashd build never holds a
  # PR. Two jobs because permissions cannot vary by event: PR runs only prove
  # the image still builds against the registry cache, with a read-only token,
  # no registry login, and no cache export (exporting the builder layers to
  # the Actions cache took 10 to 29 minutes per PR for one 5.5 GB blob and
  # crowded every other cache out of the 10 GB quota).
  zcashd-image:
    name: Build zero-zcashd (PR check)
    needs: changes
    if: needs.changes.outputs.zcashd == 'true' && github.event_name == 'pull_request'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Same build as warm-zcashd-cache below, minus the export; keep them in step.
      - name: Build zero-zcashd
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        continue-on-error: true
        with:
          context: zcashd
          file: docker/zcashd/Dockerfile
          target: runtime
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/shieldedlabs/zero-zcashd:buildcache

  # Every other event refreshes zcashd's registry build cache; images.yml
  # starts its release build from the same :buildcache.
  warm-zcashd-cache:
    name: Warm zero-zcashd build cache
    needs: changes
    if: needs.changes.outputs.zcashd == 'true' && github.event_name != 'pull_request'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build zero-zcashd
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        continue-on-error: true
        with:
          context: zcashd
          file: docker/zcashd/Dockerfile
          target: runtime
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/shieldedlabs/zero-zcashd:buildcache
          cache-to: type=registry,ref=ghcr.io/shieldedlabs/zero-zcashd:buildcache,mode=max,image-manifest=true
  smoke:
    needs: [changes, build]
    # GitHub-hosted: zebra's mainnet P2P never downloads a block on Blacksmith
    # runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZERO_IMAGE_TAG: smoke
    defaults:
      run:
        working-directory: deploy/z3-stack
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download stack images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load stack images
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          for f in "${{ runner.temp }}"/images/*.tzst; do
            zstd -d -c "$f" | docker load
          done

      # By digest, so a main run landing meanwhile cannot swap the image
      # under the test; retried, so a registry hiccup does not fail the PR.
      - name: Pull reused images from :main
        if: needs.changes.outputs.reuse != '[]'
        working-directory: ${{ github.workspace }}
        env:
          REUSE: ${{ needs.changes.outputs.reuse }}
        run: |
          set -euo pipefail
          while read -r name digest; do
            ref="ghcr.io/shieldedlabs/$name@$digest"
            for attempt in 1 2 3 4 5; do
              if docker pull "$ref"; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::could not pull $ref"
                exit 1
              fi
              sleep $(( attempt * 15 ))
            done
            docker tag "$ref" "ghcr.io/shieldedlabs/$name:smoke"
          done < <(jq -r '.[] | "\(.name) \(.digest)"' <<< "$REUSE")

      - name: Stack images under test
        working-directory: ${{ github.workspace }}
        env:
          REUSE: ${{ needs.changes.outputs.reuse }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/images.md"
          {
            echo "### Stack images under test"
            echo
            echo "| image | source | revision |"
            echo "|---|---|---|"
            for name in zero-zebra zero-zaino zero-zallet; do
              img="ghcr.io/shieldedlabs/$name:smoke"
              if ! docker image inspect "$img" > /dev/null 2>&1; then
                echo "::error::$img is neither an artifact of this run nor a reused :main image"
                exit 1
              fi
              rev=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")
              digest=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .digest' <<< "$REUSE")
              if [ -n "$digest" ]; then src="reused \`:main@$digest\`"; else src="built in this run"; fi
              echo "| $name | $src | \`${rev:-unknown}\` |"
            done
          } > "$out"
          tee -a "$GITHUB_STEP_SUMMARY" < "$out"

      - name: Wallet init, stack up, smoke probes
        run: ./smoke.sh --init --up

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps || true
          for c in zebra zaino zallet; do
            echo "::group::$c (RestartCount=$(docker inspect --format '{{.RestartCount}}' "$c" 2>/dev/null || echo '?'))"
            docker logs "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # :main is promoted only after a green smoke, and only by push and
  # scheduled runs: the release call builds a commit that already has its
  # own push run, and a late release run must not overwrite newer images.
  # A failed push reddens the main run on purpose: :main is stale.
  publish:
    name: Publish :main images
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download stack images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :main
        run: |
          set -euo pipefail
          for f in "${{ runner.temp }}"/images/*.tzst; do
            zstd -d -c "$f" | docker load
          done
          out="$RUNNER_TEMP/published.md"
          {
            echo "### Published :main images (revision \`${{ github.sha }}\`)"
            echo
            for name in zero-zebra zero-zaino zero-zallet; do
              docker tag "ghcr.io/shieldedlabs/$name:smoke" "ghcr.io/shieldedlabs/$name:main"
              docker push "ghcr.io/shieldedlabs/$name:main" > /dev/null
              echo "- \`$(docker image inspect --format '{{join .RepoDigests ", "}}' "ghcr.io/shieldedlabs/$name:main")\`"
            done
          } > "$out"
          tee -a "$GITHUB_STEP_SUMMARY" < "$out"

  # The one check to require in branch protection: reports on every PR, so a
  # workflow that never ran cannot pass as one that did. Skipped jobs pass.
  required:
    name: z3 stack smoke result
    needs: [changes, quick-checks, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r 'to_entries[]
                       | select(.value.result == "failure" or .value.result == "cancelled")
                       | .key' <<< "$NEEDS" | paste -sd, -)
          if [ -n "$bad" ]; then
            echo "::error::z3-smoke jobs failed or were cancelled: ${bad}"
            exit 1
          fi
