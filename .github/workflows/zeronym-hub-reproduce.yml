name: zeronym-hub-reproduce

# Answers "does zero-indexer-hub reproduce?" on an independent machine.
#
# This runner is the INDEPENDENT SECOND MACHINE. The recipe is first proven on an
# arm64 Mac under Rosetta emulation; a matching hash on a native x86_64 runner is
# what upgrades the claim from "deterministic on one host" to "deterministic
# across hosts", which is the property the Auditor Role actually needs. Sibling
# of zeronym-shim-reproduce.yml.
#
# The job runs zeronym/hub/deploy/reproduce.sh rather than re-implementing it, so
# CI exercises the exact command auditors are told to run (including --platform
# linux/amd64) and compares against the published hash in deploy/EXPECTED_SHA256,
# not merely build 1 against build 2. Comparing the two builds only to each other
# would make cross-machine divergence, the single failure this job exists to
# catch, exit GREEN.

on:
  workflow_dispatch:
  # PUSH, not just pull_request. This branch takes direct pushes, so gating
  # only on PRs meant the one automated check on the attested binaries had
  # never run on a commit that published a hash (Hornby review, 2026-08-19).
  # A hash could therefore be published, deployed and verified by a third
  # party without this job ever confirming it reproduces. Keep both path
  # lists identical.
  push:
    paths:
      - ".github/workflows/zeronym-hub-reproduce.yml"
      - "zeronym/hub/**"
      # The vendored path dependencies. These are what assemble.sh archives into
      # the build context, so a subtree pull touching any of them changes the
      # compiled binary and stales the published hash. Keep in sync with the
      # archive list in zeronym/hub/deploy/assemble.sh.
      - "zebra/Cargo.toml"
      - "zebra/zebra-chain/**"
      - "zebra/zebra-test/**"
      - "zaino/Cargo.toml"
      - "zaino/packages/zaino-proto/**"
  pull_request:
    paths:
      - ".github/workflows/zeronym-hub-reproduce.yml"
      - "zeronym/hub/**"
      # The vendored path dependencies. These are what assemble.sh archives into
      # the build context, so a subtree pull touching any of them changes the
      # compiled binary and stales the published hash. Keep in sync with the
      # archive list in zeronym/hub/deploy/assemble.sh.
      - "zebra/Cargo.toml"
      - "zebra/zebra-chain/**"
      - "zebra/zebra-test/**"
      - "zaino/Cargo.toml"
      - "zaino/packages/zaino-proto/**"

concurrency:
  group: zeronym-hub-reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # assemble.sh runs `git archive HEAD`, so the checked-out commit is
          # the source of truth and no history is needed.
          fetch-depth: 1

      - name: Build twice from cold and compare against the published hash
        env:
          CTX: ${{ runner.temp }}/zih-ctx
          OUT: ${{ runner.temp }}/zih-out
        run: sh zeronym/hub/deploy/reproduce.sh

      - name: Record the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-indexer-hub-binaries
          path: ${{ runner.temp }}/zih-out/out1/zero-indexer-hub
          if-no-files-found: warn
