name: caution-z3

# Build verification for the co-located enclave image (zebrad + zainod in one
# EIF). First-ever combined static-musl build; the zebra half adapts Anton
# Livaja's StageX recipe (ZcashFoundation/zebra#10491), the zaino half is our
# proven recipe. x86 only: cross-building musl under emulation is far too slow.

on:
  workflow_dispatch:
  pull_request:
    # The combined image consumes all three vendored trees, so changes there
    # can break this build; narrow filters would give false coverage.
    paths:
      - "deploy/caution-zaino/combined/**"
      - "zebra/**"
      - "zaino/**"
      - "orchard/**"
      - ".github/workflows/caution-z3.yml"

concurrency:
  group: caution-z3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-combined:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Assemble combined context
        run: bash deploy/caution-zaino/combined/assemble-combined.sh "$RUNNER_TEMP/z3-enclave"

      - name: Build combined enclave image (zebrad + zainod)
        working-directory: ${{ runner.temp }}/z3-enclave
        run: docker build -f Containerfile -t caution-z3:ci .

      - name: Smoke test both binaries and configs
        run: |
          docker run --rm --entrypoint /bin/sh caution-z3:ci -c '
            /usr/local/bin/zebrad --version &&
            /usr/local/bin/zainod --version &&
            ls -l /usr/local/bin/run-both.sh /etc/zebra/zebrad.toml /etc/zaino/zainod-colocated.toml'

      # The smoke test above runs the Docker ENTRYPOINT, but Caution starts the
      # enclave via unit.command in caution.hcl. Those can drift apart, so
      # assert the declared command actually exists and is executable.
      - name: Verify caution.hcl unit.command resolves in the image
        run: |
          set -euo pipefail
          HCL=deploy/caution-zaino/combined/caution.hcl
          CMD=$(grep -E '^[[:space:]]*command[[:space:]]*=' "$HCL" \
                | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CMD" ]; then echo "no unit.command found in $HCL"; exit 1; fi
          echo "caution.hcl unit.command = $CMD"
          if docker run --rm --entrypoint /bin/sh caution-z3:ci -c "test -x '$CMD'"; then
            echo "OK: $CMD exists and is executable in the image"
          else
            echo "FAIL: $CMD is missing or not executable in the image"
            exit 1
          fi
