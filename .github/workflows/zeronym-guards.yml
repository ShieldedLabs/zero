name: zeronym-guards

# Cheap assertions over the repository's own claims, plus the test suites.
#
# Two gaps this closes. First, `zeronym/guards.sh` checks that documents making
# security claims still agree with the code -- the class of defect that has
# shipped here twice, each time found by a person reading carefully rather than
# by anything automatic. Second, and more basic: before this workflow existed the
# repository had NO cargo test job of any kind. The reproduce workflows were the
# only automated gate and they only rebuild a binary; the 300-odd tests in the
# hub and shim crates ran on developer machines and nowhere else.
#
# Deliberately fast, so it can gate every push: no enclave build, no network, no
# Docker. The reproduce workflows remain the slow half.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/zeronym-guards.yml"
      - "zeronym/**"
  pull_request:
    paths:
      - ".github/workflows/zeronym-guards.yml"
      - "zeronym/**"

concurrency:
  group: zeronym-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on its own and on the cheap runner: a failure here is a document making
  # a claim the code does not support, and it should be visible without waiting
  # for a compile.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Repository claim guards
        run: sh zeronym/guards.sh

  tests:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # `hub` and `shim` each declare their own `[workspace]`, so they are two
      # separate build graphs with two separate target directories. Naming both
      # is what makes the cache cover the second one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zeronym/hub
            zeronym/shim

      # PROTOC must be UNSET, and `env: PROTOC: ""` does not unset it -- it
      # sets it to an empty string, which is the opposite of what is wanted.
      # Both zeronym crates take zaino-proto with default-features = false, so
      # its build.rs has no `which` branch compiled in and regenerates nothing;
      # the committed src/proto/*.rs are used as they are. But its
      # protoc_available() asks only whether PROTOC is PRESENT, and an empty
      # string is present. So the empty value forced the generation path and
      # then handed prost an empty protoc path: every run of these two jobs
      # died in under a minute on `Could not find protoc`, from the day they
      # were added, and the 336 tests they exist to run never compiled once.
      # `env -u` is what actually unsets it, and is what zeronym/nymnet/
      # localnet.sh already does for this same build script.
      - name: hub tests
        working-directory: zeronym/hub
        run: env -u PROTOC cargo test --all-targets

      - name: shim tests
        working-directory: zeronym/shim
        run: env -u PROTOC cargo test --all-targets

  # The mixnet driver is behind a feature, and a plain `cargo test` therefore
  # never compiles it -- so eight tests do not run, including all three
  # regressions for the liveness-probe finding the review raised. Measured
  # 2026-08-19: hub 147 -> 152, shim 189 -> 192.
  #
  # A separate job because it pulls the whole nym-sdk dependency tree, which is
  # most of the build time (6m22s cold versus 2m27s without). Running it beside
  # the plain job rather than after keeps the wall clock flat, and the cache
  # makes the second run cheap.
  tests-mixnet:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mixnet
          workspaces: |
            zeronym/hub
            zeronym/shim

      - name: hub tests (mixnet-driver)
        working-directory: zeronym/hub
        run: env -u PROTOC cargo test --all-targets --features mixnet-driver

      - name: shim tests (mixnet-driver)
        working-directory: zeronym/shim
        run: env -u PROTOC cargo test --all-targets --features mixnet-driver
