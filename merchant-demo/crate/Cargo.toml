# [zero] @claude The crypto core behind the merchant library. Not published.
#
# Deliberately narrow: keys, addresses, and trial decryption. It never spends, never opens a
# wallet database, and never touches the note commitment trees — a merchant only needs to
# recognise incoming payments, and everything expensive about Zcash lives on the other side
# of that line.
[package]
name = "zcash-merchant-core"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
orchard = { version = "0.15", default-features = false }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
zcash_note_encryption = "0.4.1"
zcash_client_backend = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_client_backend", default-features = false, features = ["orchard", "lightwalletd-tonic"] }
zcash_keys = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_keys", default-features = false, features = ["orchard", "sapling"] }
zcash_primitives = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_primitives", default-features = false }
zcash_protocol = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/components/zcash_protocol" }
zip32 = "0.2"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tonic-web-wasm-client = "0.9"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
zcash_client_backend = { path = "/Users/judah/Desktop/BetterSource/zero/librustzcash/zcash_client_backend", default-features = false, features = ["orchard", "lightwalletd-tonic", "test-dependencies"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
